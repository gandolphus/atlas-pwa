<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atlas · fog</title>
<style>
:root{
  --crust:#11111b; --mantle:#181825; --base:#1e1e2e;
  --surface0:#313244; --surface1:#45475a; --surface2:#585b70;
  --overlay0:#6c7086; --overlay1:#7f849c; --subtext0:#a6adc8; --subtext1:#bac2de; --text:#cdd6f4;
  --lavender:#b4befe; --green:#a6e3a1; --red:#f38ba8;
  --ui: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-family: var(--ui);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--crust);color:var(--text);overflow:hidden}
body{display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

/* bar: one row. The Walk button, one sentence of numbers, find, zoom. */
.bar{flex:none;height:44px;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--mantle);border-bottom:1px solid var(--crust);position:relative;z-index:5}
.lang{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--overlay1)}
.cov{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;justify-content:center}
.cov-t{font-size:12px;color:var(--overlay1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cov-t b{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
.cov-t em{font-style:normal;color:var(--green);font-variant-numeric:tabular-nums}
.go{height:26px;padding:0 10px;border-radius:3px;background:var(--surface0);color:var(--lavender);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.go:hover{background:var(--surface1)}
.go.on{background:var(--lavender);color:var(--crust)}
.go.done{color:var(--subtext0)}
#fq{width:140px;height:26px;background:var(--base);border:1px solid var(--surface0);border-radius:3px;color:var(--text);padding:0 8px;font:12px var(--ui)}
#fq::placeholder{color:var(--overlay0)}
#fq:focus{outline:none;border-color:var(--lavender)}
.zoom{display:flex;align-items:center;gap:2px}
.zoom button{width:24px;height:24px;border-radius:3px;color:var(--overlay1);font-size:15px;line-height:1}
.zoom button:hover{background:var(--surface0);color:var(--text)}
.zoom button.fit{font-size:11px;letter-spacing:.06em}

/* board: one sticky canvas over a tall spacer, native scroll */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:thin;scrollbar-color:var(--surface0) transparent;outline:none}
#cv{position:sticky;top:0;display:block;touch-action:pan-y;cursor:default}
#sp{width:1px}

/* one-time hints: one line, bottom centre, never two at once */
.hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:12;max-width:min(560px,92vw);text-align:center;font-size:13px;line-height:1.5;color:var(--subtext0);background:var(--mantle);border:1px solid var(--surface0);border-radius:4px;padding:8px 14px;display:none;pointer-events:none}
.hint.on{display:block}
.hint kbd{font:inherit;color:var(--text)}

/* hover label / touch loupe */
.tip{position:fixed;z-index:30;pointer-events:none;display:none;background:var(--mantle);border:1px solid var(--surface1);border-radius:3px;padding:4px 8px;font-size:13px;white-space:nowrap;max-width:min(360px,90vw);overflow:hidden;text-overflow:ellipsis}
.tip b{font-weight:600}
.tip small{color:var(--overlay0);font-variant-numeric:tabular-nums;margin-left:6px}
.tip.loupe{font-size:20px;padding:8px 14px}

/* the card: a popover beside the selected cell's hundred-block */
.pop{position:fixed;z-index:20;width:380px;max-height:calc(100dvh - 60px);overflow:hidden auto;background:var(--mantle);border:1px solid var(--surface1);border-radius:6px;padding:16px 16px 12px;display:none;scrollbar-width:thin}
.pop.on{display:block}
.arr{position:absolute;width:10px;height:10px;background:var(--mantle);border-left:1px solid var(--surface1);border-top:1px solid var(--surface1)}
.x{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:4px;color:var(--overlay1);font-size:18px}
.x:hover{background:var(--surface0);color:var(--text)}
.cl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--overlay0);padding-right:30px;display:flex;gap:10px;flex-wrap:wrap}
.cl i{font-style:normal;color:var(--lavender)}
.ph{display:flex;align-items:baseline;gap:10px;padding-right:26px;flex-wrap:wrap;margin-top:4px}
.ph h2{font-size:26px;font-weight:600;letter-spacing:-.01em}
.ph h2 i{font-style:normal;font-weight:400;color:var(--subtext0)}
.ph h2.hid{color:var(--subtext0);font-weight:500}
.ph small{font-size:11px;color:var(--overlay0);font-variant-numeric:tabular-nums}
.q{margin-top:12px;font-size:13px;color:var(--overlay1);line-height:1.5}
.cue{font-size:19px;line-height:1.5;margin-top:10px}
.cue b{color:var(--lavender);font-weight:500;letter-spacing:.06em}
.cue .en{display:block;font-size:13px;color:var(--overlay1);font-weight:400;margin-top:4px}
.tk{cursor:pointer;border-radius:2px;padding:0 1px}
.tk:hover{background:var(--surface0)}
.tk.tg{color:var(--lavender);font-weight:600}
.tk.unk{text-decoration:underline dotted var(--overlay1);text-underline-offset:4px}
.tk.off{color:var(--overlay0);font-style:italic;cursor:default}
.ans{width:100%;margin-top:10px;background:var(--base);border:1px solid var(--surface0);border-radius:3px;padding:8px 10px;font-size:15px;color:var(--text)}
.ans:focus{outline:1px solid var(--lavender);border-color:transparent}
.tr{font-size:16px;margin-top:10px}
.gr{margin-top:10px;font-size:12px;color:var(--overlay1);border-left:2px solid var(--surface0);padding-left:9px;line-height:1.45}
.vd{margin-top:10px;font-size:13px;line-height:1.45}
.vd b{font-weight:500}
.vd.bad{color:var(--red)}
.vd.ok{color:var(--green)}
.gs{margin-top:6px;font-size:13px;color:var(--overlay1)}
.gs b{color:var(--subtext1);font-weight:500}
.gs.ok,.gs.ok b{color:var(--green)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-top:14px}
.rate button{height:42px;background:var(--base);border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;color:var(--subtext1)}
.rate button small{font-size:10px;color:var(--overlay0);font-variant-numeric:tabular-nums}
.rate button:hover{background:var(--surface0)}
.rate button:first-child{color:var(--red)}
.rate button.sug{box-shadow:inset 0 -2px 0 var(--lavender)}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-top:14px}
.yn button{height:40px;background:var(--base);border-radius:2px;font-size:13px;color:var(--subtext1)}
.yn button:hover{background:var(--surface0)}
.yn button small{display:block;font-size:10px;color:var(--overlay0)}
.big{width:100%;height:38px;margin-top:12px;background:var(--base);color:var(--text);border-radius:2px;font-size:13px}
.big:hover{background:var(--surface0)}
.big small{color:var(--overlay0);margin-left:8px;font-size:11px}
.lnk{font-size:12px;color:var(--overlay1);padding:0;margin-top:10px;margin-right:14px}
.lnk:hover{color:var(--text)}
.sched{margin-top:10px;font-size:11px;color:var(--overlay0);font-variant-numeric:tabular-nums;line-height:1.5}
.open{margin-top:12px;font-size:13px;line-height:1.5;color:var(--subtext1)}
.open .lab{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--overlay0);margin-bottom:3px}
.open .sn{font-size:15px;color:var(--text)}
.open .sn .en{display:block;font-size:12px;color:var(--overlay1)}
.open.ok{color:var(--green)}
.open.ok b{color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-size:12px;padding:3px 8px;background:var(--base);border-radius:2px;color:var(--subtext1);line-height:1.4;border:1px solid var(--surface0)}
.chip:hover{background:var(--surface0);color:var(--text)}
.chip.new{border-color:var(--surface1)}
.kb{margin-top:10px;font-size:10px;color:var(--overlay0);letter-spacing:.03em;line-height:1.6}
.kb kbd{font:inherit;color:var(--overlay1)}

/* simulation strip: prototype only, hidden unless ?sim or ` */
.sim{flex:none;height:28px;display:none;align-items:center;gap:10px;padding:0 14px;background:var(--mantle);border-top:1px solid var(--crust);font-size:11px;color:var(--overlay0);font-variant-numeric:tabular-nums;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.sim.on{display:flex}
.sim b{color:var(--overlay1);font-weight:500}
.sim button{color:var(--overlay1);padding:3px 7px;border-radius:2px;border:1px solid var(--surface0)}
.sim button:hover{background:var(--surface0);color:var(--text)}
.sim .lab{letter-spacing:.1em;text-transform:uppercase;font-size:9px}

@media (max-width:720px){
  .bar{gap:8px;padding:0 10px}
  .lang,#zp,#zm{display:none}
  #fq{width:64px}
  .pop{left:0 !important;right:0;top:auto !important;bottom:0;width:auto;max-height:62dvh;border-radius:10px 10px 0 0;border-width:1px 0 0;padding:18px 18px calc(14px + env(safe-area-inset-bottom))}
  .arr{display:none}
  .x{top:10px;right:10px;width:40px;height:40px;font-size:22px}
  .ph h2{font-size:30px}
  .cue{font-size:21px}.tr{font-size:17px}
  .rate button{height:54px;font-size:14px}
  .yn button{height:50px;font-size:15px}
  .big{height:46px;font-size:15px}
  .ans{font-size:16px}
  .chip{font-size:14px;padding:6px 10px}
  .kb{display:none}
  .hint{bottom:14px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto !important}}
</style>
</head>
<body>
<header class="bar">
  <div class="lang">es</div>
  <div class="cov"><div class="cov-t" id="covt"></div></div>
  <button class="go" id="go" title="The Walk (space)"></button>
  <input id="fq" type="search" placeholder="find a word" aria-label="Find a word: reveals it on the board" autocomplete="off" spellcheck="false">
  <div class="zoom"><button id="zm" aria-label="Zoom out">−</button><button id="zp" aria-label="Zoom in">+</button><button id="z0" class="fit" aria-label="Fit what you have found">fit</button></div>
</header>
<main class="scroll" id="sc" tabindex="0" role="application" aria-label="The Spanish words you have found, most common first. Arrows move, Enter opens, Space walks.">
  <canvas id="cv" aria-hidden="true"></canvas><div id="sp"></div>
</main>
<div class="hint" id="hint"></div>
<footer class="sim" id="sim">
  <span class="lab">simulation · not product ui</span><span id="simt"></span>
  <button id="s1">+1 day</button><button id="sl10">learn 10</button><button id="sl100">learn 100</button><button id="sr">reset</button>
</footer>
<div class="pop" id="pop" role="dialog" aria-label="Word card"></div>
<div class="tip" id="tip"></div>
<div class="vh" id="live" aria-live="polite"></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const sc=$("sc"),cv=$("cv"),sp=$("sp"),pop=$("pop"),tip=$("tip"),fq=$("fq"),go=$("go"),hint=$("hint");

function load(){try{const j=JSON.parse(localStorage.getItem("atlas-fog"));if(!j)return false;day=j.day|0;log=j.log||{};probed=j.probed|0;seeded=j.seeded|0;tips=j.tips|0;if(typeof j.zoom==="number")zoom=j.zoom;(j.opened||[]).forEach(x=>openedS.add(x));
  for(const w in j.K){const i=IDM.get(w);if(i===undefined)continue;const k=blank();Object.assign(k,j.K[w]);KM.set(i,k)}return true}catch(e){return false}}

// ---------- scheduler: FSRS-shaped (power forgetting curve; ts-fsrs in the build) ----------
const TARGET=.85,FAC=19/81;
const Rof=(k,d)=>k.S>0?Math.pow(1+FAC*Math.max(0,d-k.last)/k.S,-.5):1;
const R=i=>Rof(K(i),day);
const dueAt=(i,d)=>{const k=K(i);return k.S>0&&Rof(k,d)<TARGET};
const S0=[0,.4,1.2,3.1,15];
function rate(i,r,relearn){const k=K(i),Rr=R(i);
  if(k.S===0)k.S=S0[r];
  else if(r===1){if(!relearn){k.lapses++;k.S=Math.max(.3,1.6*(Math.pow(k.S+1,.3)-1)*Math.exp(2.3*(1-Rr)))}}
  else k.S=k.S*(1+15*Math.pow(k.S,-.1)*(Math.exp(1-Rr)-1)*[0,0,.6,1,1.5][r]);
  k.last=day;k.reps++;k.claimed=0;}
const ivlOf=S=>S*(Math.pow(TARGET,-2)-1)/FAC;
const fmtIv=d=>d<1?"<1d":d<30?Math.round(d)+"d":d<365?Math.round(d/30)+"mo":(d/365).toFixed(1)+"y";
const fmtD=S=>S<1?Math.round(S*24)+" h":S<10?S.toFixed(1)+" d":Math.round(S)+" d";

// =====================================================================
// FOG: a word is on the board once a sentence you opened contains it; it is yours once you have produced it. Yours words open sentences.
// =====================================================================
const yours=x=>typeof x==="number"&&(K(x).green||K(x).claimed);
// the gap of a sentence: one representative (most frequent reading) per sub-lemma no reading of which is yours
function gapOf(s,ex){const g=[];s.parts.forEach(p=>{if(!p.alts||!p.alts.length)return;for(const a of p.alts){if(a.includes(ex))continue;if(a.some(yours))continue;let m=Infinity;a.forEach(x=>{if(typeof x==="number"&&x<m)m=x});if(isFinite(m)&&!g.includes(m))g.push(m)}});return g}
const readable=s=>gapOf(s,-1).length===0;
let nRead=0;function countRead(){nRead=0;bank.forEach(s=>{if(readable(s))nRead++})}
// which sentence to open from a yours word: fewest unknowns (≤3), then the most frequent unknowns, then the shortest; sentences that would reveal nothing new go last
function sentScore(s,ex){const g=gapOf(s,ex);if(!g.length||g.length>3)return null;const nw=g.filter(x=>!K(x).vis).length;return(nw?0:5e6)+g.length*1e6+g.reduce((a,x)=>a+x,0)/g.length*10+s.n}
function branch(i){const k=K(i);let best=null,bs=Infinity;(INV.get(i)||[]).forEach(s=>{if(openedS.has(s.key))return;const sc=sentScore(s,i);if(sc!=null&&sc<bs){bs=sc;best=s}});
  if(!best)return null;openedS.add(best.key);k.opened.push(best.key);const g=gapOf(best,i),nw=[];g.forEach(x=>{if(revealCell(x,best.key))nw.push(x)});flushAppear(i);return{s:best,g,nw}}
// the sentence to learn/review a word in: fewest other unknowns, most frequent ones, shortest
function bestSent(i){const via=K(i).via;let best=null,bs=Infinity;(INV.get(i)||[]).forEach(s=>{const g=gapOf(s,i),sc=g.length*1e6+(g.length?g.reduce((a,x)=>a+x,0)/g.length:0)*10+s.n-(s.key===via?1e5:openedS.has(s.key)?.5:0);if(sc<bs){bs=sc;best=s}});return best}
// the board is the found cards only, in rank order, reflowed compactly: nothing on it says how much is left (rank stays internal)
let order=[],pos=new Int32Array(N).fill(-1),needLayout=false;
// motion state (never saved, so nothing re-fires on reload): appear = card → start time of its pop-in; glide = card → where it was before the reflow; fresh = found since the learner's last action
const appear=new Map(),glide=new Map(),fresh=new Set();let pendingAppear=[],oldXY=null,appearUntil=0;
const APPEAR_MS=RM?240:520,GLIDE_MS=200;
function reorder(){if(!oldXY&&L.p&&!auto){oldXY=new Map();for(const i of order){const c=cellXY(i);if(c)oldXY.set(i,c)}}order=[];for(let i=0;i<N;i++)if(K(i).vis)order.push(i);pos.fill(-1);order.forEach((i,k)=>pos[i]=k);needLayout=true}
function revealCell(i,via){const k=K(i);if(k.vis)return false;k.vis=1;k.via=via;if(!auto){reorder();fresh.add(i);pendingAppear.push(i)}repaint(i);return true}
// the celebration: the parent fills first, then its new words pop in, rippling outward from the parent across the grid (55 ms apart, at most 24 steps); reduced motion = fade only, no stagger
function flushAppear(parent){if(!pendingAppear.length)return;const now=performance.now();if(appearUntil<now)appearUntil=0;const base=Math.max(now+(RM?0:260),appearUntil?appearUntil+55:0);
  const pp=parent>=0?pos[parent]:-1,list=pendingAppear.slice().sort((a,b)=>pp<0?a-b:Math.abs(pos[a]-pp)-Math.abs(pos[b]-pp));
  list.forEach((i,j)=>{const t=base+(RM?0:Math.min(j,24)*55);appear.set(i,t);appearUntil=Math.max(appearUntil,t)});pendingAppear=[];req()}
// a word becomes yours: it turns green and opens one sentence — except the seed pair, which opens nothing until the first sentence has been typed
function turnGreen(i){const k=K(i);k.green=1;repaint(i);if(!seeded&&(i===HOLA||i===MUNDO))return null;return branch(i)}
const seedDone=()=>!seeded&&!probed&&K(HOLA).green&&K(MUNDO).green;
// the first cascade: typing ¡Hola, mundo! opens two sentences from each seed word (six tiles)
function seedCascade(){seeded=1;openedS.add(SEED0.key);const op=[];for(let r=0;r<2;r++)for(const i of [HOLA,MUNDO]){const b=branch(i);if(b)op.push(b)}return op}
// after a probe or at a dead end: reveal the words that stand alone (or nearly) between you and a sentence
function revealFrontier(max){const c=new Map();for(let gl=1;gl<=3&&c.size<max;gl++)bank.forEach(s=>{if(openedS.has(s.key))return;const g=gapOf(s,-1);if(g.length!==gl)return;g.forEach(x=>{if(!K(x).vis&&!c.has(x))c.set(x,s.key)})});
  const list=[...c].sort((a,b)=>a[0]-b[0]).slice(0,max);list.forEach(([x,key])=>{revealCell(x,key);openedS.add(key)});
  if(list.length){flushAppear(-1);return list.length}
  // the bank has nothing left for this learner (prototype bank is small): fall back to frequency order, bare words
  let n=0;for(let i=0;i<N&&n<max;i++)if(!K(i).vis){revealCell(i,"rank");n++}flushAppear(-1);return n}
function candidates(){const c=[];for(let i=0;i<N;i++){const k=K(i);if(k.vis&&!k.green&&!k.claimed&&k.S===0)c.push(i)}return c}

// =====================================================================
// BOARD STATE + STATS
// =====================================================================
const due=new Uint8Array(N),bk=new Uint8Array(N);
let nDue=0,nYours=0,nVis=0,covText="",msgT=0,auto=false;
function repaint(i){const k=K(i);if(!k.vis){bk[i]=0;return}if(k.green||k.claimed){const t=Math.min(1,Math.max(0,Math.log2(k.S+1)/Math.log2(181)));bk[i]=3+Math.min(29,Math.floor(t*29.999))}else bk[i]=k.S>0?2:1}
function stats(){
  nDue=0;nYours=0;nVis=0;for(let i=0;i<N;i++){const k=K(i);const d=dueAt(i,day)?1:0;due[i]=d;nDue+=d;if(k.vis)nVis++;if(k.green||k.claimed)nYours++}
  countRead();
  // only what is yours: never a total, a rank, or a fraction of anything
  covText=narrow()?'<em>'+nYours+'</em> · <b>'+nRead+'</b>':'<em>'+nYours.toLocaleString("en")+'</em> yours · <b>'+nRead+'</b> sentence'+(nRead===1?'':'s')+' readable';
  if(!msgT)$("covt").innerHTML=covText;
  updateGo();
}
function msg(t){clearTimeout(msgT);$("covt").innerHTML=t;msgT=setTimeout(()=>{msgT=0;$("covt").innerHTML=covText},3500)}
// one-time hints: bit n shown once ever
const TIP=["Two words are on the board. Click one — or press <kbd>space</kbd>.","Green means yours. Make the other one yours too, then type the sentence they make.","Every green word opens a sentence; its words appear around it. Pick any tile, or press <kbd>space</kbd> and the board picks for you.","A hollow tile is due: recall it and it fills again."];
function showTip(n){if(tips&(1<<n))return;tips|=1<<n;hint.innerHTML=TIP[n];hint.classList.add("on");save()}
function hideTip(){hint.classList.remove("on")}

// =====================================================================
// LAYOUT + DRAW: only the hundred-blocks you have touched, in rank order, auto-fitted (zoom 0 = everything found on one screen)
// =====================================================================
const PMIN=3,PMAX=180;let L={},dpr=1;
const cgap=p=>p<7?0:Math.min(14,Math.max(1,Math.round(p*.08)));
const zOfP=p=>Math.log(p/PMIN)/Math.log(PMAX/PMIN);
// the largest cell that shows every found card at once (zoom 0 = fit; wide screens stay full, nothing is dead space)
function fitP(W,vh,n,M){for(let c=1;c<=2000;c++){const pe=(W-2*M)/c,g=cgap(pe),p=Math.min(PMAX,pe-g*(c-1)/c);if(p<PMIN)return PMIN;const rows=Math.ceil(n/c);if(2*M+rows*(p+g)-g<=vh)return p}return PMIN}
function layout(){
  const W=sc.clientWidth,vh=sc.clientHeight,n=Math.max(1,order.length),M=narrow()?10:18;
  const pf=fitP(W,vh,n,M);
  let p=pf;if(zoom>0){const pd=PMIN*Math.pow(PMAX/PMIN,zoom);p=Math.max(pf,Math.min(PMAX,pd));if(p<=pf){p=pf;zoom=0}}
  const gap=cgap(p),cols=Math.max(1,Math.floor((W-2*M+gap)/(p+gap))),rows=Math.ceil(n/cols);
  const stage=p<7?0:p<28?1:p<46?2:3;
  L={W,vh,p,gap,cols,rows,M,stage,H:2*M+rows*(p+gap)-gap};
  dpr=Math.min(2,devicePixelRatio||1);
  cv.width=Math.round(W*dpr);cv.height=Math.round(vh*dpr);cv.style.width=W+"px";cv.style.height=vh+"px";
  sp.style.height=Math.max(0,L.H-vh)+"px";needLayout=false;
}
const cellXY=i=>{const k=pos[i];if(k<0)return null;return{x:L.M+(k%L.cols)*(L.p+L.gap),y:L.M+Math.floor(k/L.cols)*(L.p+L.gap)}};
function hit(x,y){
  const c=Math.floor((x-L.M)/(L.p+L.gap)),r=Math.floor((y-L.M)/(L.p+L.gap));if(c<0||c>=L.cols||r<0)return-1;
  if(x-L.M-c*(L.p+L.gap)>=L.p||y-L.M-r*(L.p+L.gap)>=L.p)return-1;
  const k=r*L.cols+c;return k<order.length?order[k]:-1;
}
function setZoom(z,ai,sy){
  zoom=Math.max(0,Math.min(1,z));
  if(ai==null||ai<0){ai=sel>=0&&isVisible(sel)?sel:hit(L.W/2,sc.scrollTop+L.vh/3)}
  const c=ai>=0?cellXY(ai):null;if(sy==null&&c)sy=c.y-sc.scrollTop;
  layout();const c2=ai>=0?cellXY(ai):null;if(c2&&sy!=null)sc.scrollTop=c2.y-sy;save();
  draw();if(pop.classList.contains("on"))place();
}
function zoomStep(d){const np=L.p*(d>0?1.25:.8);setZoom(np<=fitP(L.W,L.vh,Math.max(1,order.length),L.M)?0:zOfP(np))}

const B=Array.from({length:NB},()=>[]),vis=[],anims=new Map();
let sel=-1,hov=-1,link=new Set();
let dirty=false;const req=()=>{if(!dirty){dirty=true;requestAnimationFrame(()=>{dirty=false;draw()})}};
const w100=new Float32Array(N).fill(-1);
function fit(i,fs,av){
  if(w100[i]<0){const f=ctx.font;ctx.font="500 100px "+T("ui");w100[i]=ctx.measureText(words[i].w).width;ctx.font=f}
  const w=w100[i]*fs/100;if(w*.8<=av)return words[i].w;
  const n=Math.max(1,Math.floor(words[i].w.length*av/(w*.8))-1);return words[i].w.slice(0,n)+"…";
}
const inkOf=i=>due[i]?1:bk[i]===1?1:bk[i]===2?2:bk[i]>=22?3:2;
const INK=[C.o1,C.sub,C.text,C.crust];
function draw(){
  if(needLayout)layout();
  const now=performance.now();
  const{W,vh,p,gap,cols,rows,M,stage}=L,s=sc.scrollTop;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=C.crust;ctx.fillRect(0,0,W,vh);
  for(const a of B)a.length=0;vis.length=0;const late=[];
  const Rc=(x,y)=>{const x0=Math.round(x),y0=Math.round(y);ctx.rect(x0,y0,Math.round(x+p)-x0,Math.round(y+p)-y0)};
  // cards that only moved in the reflow glide (≤ 200 ms) so the new ones are the only event; reduced motion: they jump
  if(oldXY){if(!RM)oldXY.forEach((o,i)=>{const c=cellXY(i);if(c&&(c.x!==o.x||c.y!==o.y))glide.set(i,{x0:o.x,y0:o.y,t0:now})});oldXY=null}
  const ease=u=>1-Math.pow(1-u,3);
  const r0=Math.max(0,Math.floor((s-M)/(p+gap))),r1=Math.min(rows-1,Math.floor((s+vh-M)/(p+gap)));
  for(let r=r0;r<=r1;r++){const y0=M+r*(p+gap)-s;for(let c=0;c<cols;c++){const k=r*cols+c;if(k>=order.length)break;const i=order[k];let x=M+c*(p+gap),y=y0;
    const gl=glide.get(i);if(gl){const u=(now-gl.t0)/GLIDE_MS;if(u>=1)glide.delete(i);else{const e=ease(u);x=gl.x0+(x-gl.x0)*e;y=gl.y0-s+(y-(gl.y0-s))*e}}
    const ts=appear.get(i);if(ts!==undefined){const t=(now-ts)/APPEAR_MS;if(t<0)continue;if(t>=1)appear.delete(i);else{late.push(i,x,y,t);vis.push(i,x,y);continue}}
    vis.push(i,x,y);B[bk[i]].push(x,y)}}
  for(let b=1;b<NB;b++){const a=B[b];if(!a.length)continue;ctx.fillStyle=COL[b];ctx.beginPath();for(let j=0;j<a.length;j+=2)Rc(a[j],a[j+1]);ctx.fill()}
  // the pop-in: fade, a quick scale with a soft overshoot, and one lavender ring pulse rolling off the edge (reduced motion: fade only)
  for(let j=0;j<late.length;j+=4){const i=late[j],x=late[j+1],y=late[j+2],t=late[j+3];
    const a=Math.min(1,t*2.5),sc_=RM?1:(.75+.25*a)+.14*Math.sin(Math.PI*t),cs=p*sc_,ox=x+(p-cs)/2,oy=y+(p-cs)/2;
    ctx.globalAlpha=a;ctx.fillStyle=COL[bk[i]];ctx.fillRect(Math.round(ox),Math.round(oy),Math.round(cs),Math.round(cs));
    if(!RM){const off=1+9*t;ctx.globalAlpha=(1-t)*.9;ctx.strokeStyle=C.lav;ctx.lineWidth=Math.max(1,p*.03);ctx.strokeRect(x-off,y-off,p+2*off,p+2*off)}
    ctx.globalAlpha=1}
  // due = hollow: the tint stays as a ring, the interior empties; a rating refills it
  const rw=p<5?1:Math.max(1,Math.round(p*.13));
  ctx.fillStyle=C.crust;ctx.beginPath();
  for(let j=0;j<vis.length;j+=3){const i=vis[j];let f=due[i]?1:0;const a=anims.get(i);
    if(a!==undefined){const t=(now-a)/240;if(t>=1)anims.delete(i);else f=1-t*(2-t)}
    if(f<=0)continue;const x=Math.round(vis[j+1]),y=Math.round(vis[j+2]),cs=Math.round(vis[j+1]+p)-x,inn=(cs-2*rw)*f;
    if(inn>=1)ctx.rect(x+(cs-inn)/2,y+(cs-inn)/2,inn,inn)}
  ctx.fill();
  // lemma text (never the gloss, never a number: the board gives away neither a retrieval target nor the size of the language)
  if(stage>=2){
    const cs=p,pad=stage===2?Math.max(1,Math.round(p*.04)):Math.max(3,Math.round(p*.08));
    const fs=stage===2?Math.max(9,Math.min(13,p*.27)):Math.min(22,p*.19);
    for(let k=0;k<4;k++){
      ctx.fillStyle=INK[k];ctx.font="500 "+fs.toFixed(1)+"px "+T("ui");ctx.textBaseline="middle";ctx.textAlign=stage===2?"center":"left";
      for(let j=0;j<vis.length;j+=3){const i=vis[j];if(inkOf(i)!==k)continue;const x=vis[j+1],y=vis[j+2];
        if(appear.has(i))ctx.globalAlpha=Math.min(1,(now-appear.get(i))/APPEAR_MS*2.5);
        if(stage===2)ctx.fillText(fit(i,fs,cs-2*pad),x+cs/2,y+cs/2+.5,cs-2*pad);
        else ctx.fillText(fit(i,fs,cs-2*pad),x+pad,y+cs*.5,cs-2*pad);
        ctx.globalAlpha=1}
      if(stage===3){ctx.globalAlpha=.55;ctx.font=Math.max(9,p*.11).toFixed(1)+"px "+T("ui");
        for(let j=0;j<vis.length;j+=3){const i=vis[j];if(inkOf(i)!==k||!words[i].art)continue;ctx.fillText(words[i].art,vis[j+1]+pad,vis[j+2]+cs*.5-fs*.95)}
        ctx.globalAlpha=1}
    }
  }
  // transient outlines: the open card's sentence-mates (dashed), cards found since your last action (lavender), hover, selection
  const box=i=>{const c=cellXY(i);if(!c)return null;const x0=Math.round(c.x),y0=Math.round(c.y-s),cs=Math.round(c.x+p)-x0;return[x0,y0,cs]};
  if(link.size&&p>=7){ctx.save();ctx.setLineDash([3,2]);ctx.strokeStyle=C.text;ctx.lineWidth=1;ctx.beginPath();for(let j=0;j<vis.length;j+=3){const i=vis[j];if(link.has(i)){const bx=box(i);if(bx)ctx.rect(bx[0]+1.5,bx[1]+1.5,bx[2]-3,bx[2]-3)}}ctx.stroke();ctx.restore()}
  if(fresh.size){ctx.strokeStyle=C.lav;ctx.lineWidth=p>=22?2:1;ctx.beginPath();for(let j=0;j<vis.length;j+=3){const i=vis[j];if(fresh.has(i)&&i!==sel&&!appear.has(i)){const bx=box(i);if(bx)ctx.rect(bx[0]+1,bx[1]+1,bx[2]-2,bx[2]-2)}}ctx.stroke()}
  if(hov>=0&&hov!==sel){const bx=box(hov);if(bx){ctx.strokeStyle=C.o1;ctx.lineWidth=1;ctx.strokeRect(bx[0]+.5,bx[1]+.5,bx[2]-1,bx[2]-1)}}
  if(sel>=0&&K(sel).vis){const bx=box(sel);if(bx){ctx.lineWidth=2;ctx.strokeStyle=C.crust;ctx.strokeRect(bx[0]+1,bx[1]+1,bx[2]-2,bx[2]-2);ctx.strokeStyle=C.text;ctx.strokeRect(bx[0]-1,bx[1]-1,bx[2]+2,bx[2]+2)}}
  if(anims.size||appear.size||glide.size)req();
}

// =====================================================================
// SELECTION + CARD PLACEMENT
// =====================================================================
const live=$("live");
function isVisible(i){const c=cellXY(i);if(!c)return false;const y=c.y-sc.scrollTop;return y>=0&&y+L.p<=L.vh}
function ensureVisible(i,smooth){
  const c=cellXY(i);if(!c)return;const y=c.y,s=sc.scrollTop,top=narrow()&&pop.classList.contains("on")?L.vh*.38:L.vh;
  let t=null;if(y<s+8)t=y-Math.min(L.vh*.3,120);else if(y+L.p>s+top-8)t=y+L.p-top+Math.min(top*.3,120);
  if(t!=null)sc.scrollTo({top:t,behavior:smooth&&!RM?"smooth":"auto"});
}
function select(i,smooth){
  if(i<0||i>=N)return;sel=i;const k=K(i);
  live.textContent=words[i].w+", "+(k.green?"yours":k.claimed?"claimed":k.S>0?"learning":"new")+(due[i]?", due":"");
  req();ensureVisible(i,smooth);if(pop.classList.contains("on"))place();
}
let side=null;
function place(){
  if(narrow()){pop.style.cssText="";return}
  const c=cellXY(sel);if(!c)return;
  const r=sc.getBoundingClientRect(),cx=r.left+c.x,cy=r.top+c.y-sc.scrollTop,p=L.p,vw=innerWidth,vh=innerHeight,pw=pop.offsetWidth,ph=pop.offsetHeight,g=10,m=8;
  const C2={r:cx+p+g,l:cx-g-pw};
  const ok=k=>C2[k]>=m&&C2[k]+pw<=vw-m;
  if(!(side&&ok(side)))side=["r","l"].find(ok)||null;
  const top=r.top+m;let px,py;
  if(side){px=C2[side];py=Math.max(top,Math.min(vh-ph-m,cy+p/2-ph*.3))}
  else{px=Math.max(m,Math.min(vw-pw-m,cx+p/2-pw/2));py=cy+p+g;if(py+ph>vh-m)py=Math.max(top,cy-ph-g)}
  pop.style.left=px+"px";pop.style.top=py+"px";
  const ar=pop.querySelector("#arr");if(!ar)return;const ay=Math.max(10,Math.min(ph-20,cy+p/2-py-5));
  if(side==="r")ar.style.cssText="left:-6px;top:"+ay+"px;transform:rotate(-45deg)";
  else if(side)ar.style.cssText="right:-6px;top:"+ay+"px;transform:rotate(135deg)";
  else ar.style.cssText="display:none";
}
function closePop(){pop.classList.remove("on");pop.innerHTML="";side=null;step=null;link.clear();fresh.clear();req();updateGo()}

// =====================================================================
// THE WALK + STEPS: one engine; clicking a cell opens the step its state calls for
// =====================================================================
let walk=null,steps=0,relearn=[],step=null,probe=null;
function plan(){const Lg=log[day]||(log[day]={rev:0,new:0});const dl=[];for(let i=0;i<N;i++){const k=K(i);if(k.S>0&&Rof(k,day)<TARGET)dl.push(i)}return{due:dl,cands:candidates(),newQ:Math.max(0,20-Lg.new),L:Lg}}
function pick(){
  const rl=relearn.find(x=>steps-x.at>=5);if(rl){relearn.splice(relearn.indexOf(rl),1);return{kind:"again",i:rl.i}}
  const P=plan();

    else if(a==="branch"){const op=branch(step.i);if(op){reorder();layout();stats();save();step.opened=[op];render()}}});
  d.querySelectorAll("[data-go]").forEach(b=>b.onclick=e=>{e.stopPropagation();if(walk)stopWalk();openStep(+b.dataset.go,null,false)});
  const ai=d.querySelector("[data-ans]");if(ai){ai.addEventListener("keydown",e=>{e.stopPropagation();if(e.key==="Enter"){e.preventDefault();if(step.phase==="spell")spelled();else if(step.phase==="guess")commitGuess();else if(step.phase==="recall")recalled();else reveal()}if(e.key==="Escape"){e.preventDefault();if(walk)stopWalk();else closePop()}});if(!matchMedia("(hover:none)").matches)ai.focus()}
  d.querySelectorAll(".tk[data-ids]").forEach(t=>{const ids=t.dataset.ids.split(",").map(Number);
    t.addEventListener("mouseenter",()=>{const x=ids.find(x=>K(x).vis);if(x!==undefined){hov=x;req()}});t.addEventListener("mouseleave",()=>{hov=-1;req()});
    t.onclick=e=>{e.stopPropagation();if(ids.includes(step.i))return;const x=ids.find(x=>K(x).vis)??ids[0];if(!K(x).vis)return;if(walk)stopWalk();openStep(x,null,false)}});
}
function updateGo(){
  go.classList.remove("on","done");
  if(walk){go.textContent="■ stop";simText();return}
  if(!nYours&&!probed){go.textContent="▸ begin";simText();return}
  const P=plan(),nn=Math.min(P.newQ,P.cands.length);
  if(P.due.length+nn===0){go.textContent=(narrow()?"✓":"✓ done · more");go.classList.add("done")}
  else go.textContent="▸ "+P.due.length+" due · "+nn+" new";
  simText();
}
go.onclick=()=>{if(walk){stopWalk();return}const P=plan();if(!P.due.length&&(!P.newQ||!P.cands.length)){P.L.new=Math.max(0,P.L.new-10);save()}startWalk()};

// =====================================================================
// FIND = summon: a word you name appears on the board (the fog lifts over that one cell)
// =====================================================================
fq.addEventListener("keydown",e=>{e.stopPropagation();if(e.key==="Escape"){fq.value="";fq.blur();sc.focus();return}if(e.key!=="Enter")return;e.preventDefault();
  const v=strip(fq.value.trim().toLowerCase());if(!v)return;let i=-1;for(let j=0;j<N;j++)if(words[j].norm===v){i=j;break}
  if(i<0){msg('no card for <b>'+esc(fq.value)+'</b>');return}
  if(walk)stopWalk();const isNew=revealCell(i,"found");if(isNew){flushAppear(-1);layout();stats();save()}fq.value="";fq.blur();sc.focus({preventScroll:true});openStep(i,null,false);if(isNew)msg('<b>'+esc(words[i].w)+'</b> is on the board now');
});

// =====================================================================
// POINTER, TOUCH, KEYS
// =====================================================================
const local=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top+sc.scrollTop]};
let tipT=0;
function showHover(i,cx,cy,loupe){
  if(i<0){tip.style.display="none";return}
  tip.className="tip"+(loupe?" loupe":"");
  const k=K(i),st=k.green?(due[i]?"due":"yours · stable "+fmtD(k.S)):k.claimed?"claimed":k.S>0?(due[i]?"due":"learning"):"new";
  tip.innerHTML='<b>'+esc((words[i].art?words[i].art+" ":"")+words[i].w)+'</b><small>'+st+'</small>';  // lemma and state only — never the gloss, never a rank
  tip.style.display="block";const w=tip.offsetWidth,h=tip.offsetHeight;
  let x=loupe?cx-w/2:cx+14,y=loupe?cy-h-56:cy+16;
  x=Math.max(6,Math.min(innerWidth-w-6,x));if(y+h>innerHeight-6)y=cy-h-10;if(y<50)y=cy+40;
  tip.style.left=x+"px";tip.style.top=y+"px";
}
cv.addEventListener("pointermove",e=>{
  if(e.pointerType==="touch")return;
  const[x,y]=local(e),i=hit(x,y);
  if(i!==hov){hov=i;req();clearTimeout(tipT);tip.style.display="none";
    if(i>=0&&!(pop.classList.contains("on")&&i===sel)){const cx=e.clientX,cy=e.clientY;tipT=setTimeout(()=>showHover(i,cx,cy,false),L.stage<2?0:300)}}
  else if(tip.style.display==="block")showHover(i,e.clientX,e.clientY,false);
});
cv.addEventListener("pointerleave",()=>{hov=-1;clearTimeout(tipT);tip.style.display="none";req()});
cv.addEventListener("pointerdown",e=>{if(e.pointerType==="touch"||e.button!==0)return;const[x,y]=local(e),i=hit(x,y);if(i<0)return;sc.focus({preventScroll:true});if(step&&step.kind==="probe")return;if(walk&&i!==sel)stopWalk();if(!walk)openStep(i,null,false)});
let tt=null,pinch=null;
cv.addEventListener("touchstart",e=>{
  if(e.touches.length===2){clearTimeout(tt&&tt.timer);tt=null;const[a,b]=e.touches;pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),z:zoom,cy:(a.clientY+b.clientY)/2};return}
  const t=e.touches[0];tt={x:t.clientX,y:t.clientY,t:performance.now(),loupe:false};
  tt.timer=setTimeout(()=>{if(!tt)return;tt.loupe=true;const i=hit(...local(t));tt.i=i;hov=i;showHover(i,t.clientX,t.clientY,true);req()},320);
},{passive:true});
cv.addEventListener("touchmove",e=>{
  if(pinch&&e.touches.length===2){e.preventDefault();const[a,b]=e.touches,d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);const r=cv.getBoundingClientRect(),ai=hit(L.W/2,pinch.cy-r.top+sc.scrollTop);setZoom(pinch.z+Math.log(d/pinch.d)/Math.log(PMAX/PMIN),ai);return}
  if(!tt)return;const t=e.touches[0];
  if(tt.loupe){e.preventDefault();const i=hit(...local(t));if(i!==tt.i){tt.i=i;hov=i;req()}showHover(i,t.clientX,t.clientY,true);return}
  if(Math.hypot(t.clientX-tt.x,t.clientY-tt.y)>8){clearTimeout(tt.timer);tt=null}
},{passive:false});
cv.addEventListener("touchend",e=>{
  if(pinch){if(e.touches.length<2)pinch=null;return}
  if(!tt)return;clearTimeout(tt.timer);const t=e.changedTouches[0];
  if(step&&step.kind==="probe"){tip.style.display="none";hov=-1;tt=null;req();return}
  if(tt.loupe){tip.style.display="none";hov=-1;if(tt.i>=0){e.preventDefault();if(walk)stopWalk();openStep(tt.i,null,false)}}
  else if(performance.now()-tt.t<400){const i=hit(...local(t));if(i>=0){e.preventDefault();if(walk&&i!==sel)stopWalk();if(!walk)openStep(i,null,false)}}  // preventDefault: no synthesized click may land on the sheet that just opened
  tt=null;
},{passive:false});
sc.addEventListener("wheel",e=>{if(!(e.ctrlKey||e.metaKey))return;e.preventDefault();const[x,y]=local(e);let i=hit(x,y);if(i<0)i=hit(L.W/2,y);const c=i>=0?cellXY(i):null;setZoom(zoom-e.deltaY*(e.deltaMode?0.05:0.0016),i,c?c.y-sc.scrollTop:null)},{passive:false});
sc.addEventListener("scroll",()=>{req();if(pop.classList.contains("on")&&!narrow())place()},{passive:true});
document.addEventListener("pointerdown",e=>{if(pop.classList.contains("on")&&!walk&&!pop.contains(e.target)&&e.target!==cv&&!e.target.closest(".bar")&&!e.target.closest(".sim"))closePop()});
new ResizeObserver(()=>{if(sc.clientWidth===L.W&&sc.clientHeight===L.vh)return;const a=sel>=0&&isVisible(sel)?sel:null;setZoom(zoom,a);stats()}).observe(sc);
$("zm").onclick=()=>zoomStep(-1);$("zp").onclick=()=>zoomStep(1);$("z0").onclick=()=>setZoom(0);
function moveSel(d){ // over the found cards: ←→ by rank, ↑↓ by row of the grid
  if(!order.length)return;
  if(sel<0||pos[sel]<0){select(order[0]);return}
  const k=pos[sel];let nk=d==="L"?k-1:d==="R"?k+1:d==="D"?k+L.cols:k-L.cols;
  if(nk<0||nk>=order.length)return;const i=order[nk];
  if(walk)stopWalk();if(pop.classList.contains("on"))openStep(i,null,false);else select(i,false);
}
document.addEventListener("keydown",e=>{
  const t=e.target;if(t===fq||t.tagName==="INPUT"||t.tagName==="TEXTAREA")return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key,open=pop.classList.contains("on");
  const arrow={ArrowLeft:"L",ArrowRight:"R",ArrowUp:"U",ArrowDown:"D"}[k];
  if(k==="`"){$("sim").classList.toggle("on");setTimeout(()=>setZoom(zoom),0);return}
  if(arrow){e.preventDefault();if(step&&step.kind==="probe")return;moveSel(arrow);return}
  if(k==="Escape"){e.preventDefault();hideTip();if(walk)stopWalk();else if(open)closePop();sc.focus();return}
  if(k==="g"||k==="G"){e.preventDefault();autoLearn(k==="g"?1:10);return}
  if(step&&open){
    const ph=step.phase;
    if(step.kind==="probe"){if(k==="1"||k==="2")answer(+k);return}
    if(k===" "||k==="Enter"){if(t.closest&&t.closest(".pop")&&t.tagName==="BUTTON"&&k==="Enter")return;e.preventDefault();
      if(ph==="guess")commitGuess();else if(ph==="meet"||ph==="miss")toRecall();else if(ph==="recall")recalled();
      else if(ph==="ask"||ph==="closed")reveal();else if(ph==="reveal"){if(step.kind==="due")answer(suggested());else toSpell()}else if(ph==="rate")answer(suggested());else if(ph==="after")continueStep();else if(ph==="open"&&k===" ")openStep(step.i,K(step.i).green||K(step.i).claimed?"due":"again",false);return}
    if(/^[1-4]$/.test(k)&&(ph==="rate"||(ph==="reveal"&&step.kind==="due"))){e.preventDefault();answer(+k);return}
    if(k==="k"&&!walk&&ph==="guess"&&!K(step.i).S){e.preventDefault();claimWord(step.i);return}
    if(k==="b"&&ph==="open"){e.preventDefault();const op=branch(step.i);if(op){reorder();layout();stats();save();step.opened=[op];render()}return}
    if(walk)return;
  }
  switch(k){
    case"Enter":case" ":e.preventDefault();if(!open){if(k===" ")startWalk();else if(sel>=0&&K(sel).vis)openStep(sel,null,false)}break;
    case"+":case"=":zoomStep(1);break;
    case"-":case"_":zoomStep(-1);break;
    case"0":setZoom(0);break;
    case"/":e.preventDefault();fq.focus();fq.select();break;
    case"k":if(sel>=0&&K(sel).vis)claimWord(sel);break;
    case"PageDown":e.preventDefault();sc.scrollBy(0,L.vh*.9);break;
    case"PageUp":e.preventDefault();sc.scrollBy(0,-L.vh*.9);break;
  }
});

// =====================================================================
// SIMULATION (prototype only): jump time; auto-learn N words the way the Walk would pick them
// =====================================================================
function simText(){if(!$("sim").classList.contains("on"))return;let g=0,l=0;KM.forEach(k=>{if(k.green)g++;else if(k.S>0)l++});const c=candidates().length;
  const top=[200,500,1000].map(n=>{let y=0;for(let i=0;i<n;i++)if(yours(i))y++;return '<b>'+y+'</b>/'+n}).join(" · ");
  $("simt").innerHTML='day <b>'+day+'</b> · yours <b>'+g+'</b> · learning <b>'+l+'</b> · open tiles <b>'+c+'</b> · due <b>'+nDue+'</b> · debug, yours in top '+top}
function autoLearn(n){
  if(walk)stopWalk();closePop();auto=true;
  for(let j=0;j<n;j++){const P=plan();let i=-1;
    if(P.due.length&&Math.random()<.6){let bs=-1;P.due.forEach(x=>{const s=share(x)*(1-R(x));if(s>bs){bs=s;i=x}});const ok=Math.random()<Math.min(.97,R(i)+.1);rate(i,ok?3:1);P.L.rev++;repaint(i);continue}
    let c=P.cands;if(!c.length){revealFrontier(6);c=candidates()}if(!c.length)break;
    let bs=-1;c.forEach(x=>{const s=bestSent(x),g=s?gapOf(s,x).length:9,sc=share(x)*(g<=1?2:g===2?1.3:1)*(x===HOLA||x===MUNDO?100:1);if(sc>bs){bs=sc;i=x}});
    rate(i,3);P.L.new++;turnGreen(i);
    if(seedDone())seedCascade();
  }
  auto=false;reorder();layout();for(let i=0;i<N;i++)repaint(i);stats();save();draw();
}
function advance(d){day+=d;save();for(let i=0;i<N;i++)repaint(i);stats();req();if(nDue)showTip(3)}
$("s1").onclick=()=>{stopWalk();advance(1)};
$("sl10").onclick=()=>autoLearn(10);
$("sl100").onclick=()=>autoLearn(100);
$("sr").onclick=()=>{stopWalk();localStorage.removeItem("atlas-fog");location.search="?sim"};

// =====================================================================
// INIT  (?reset · ?sim[=N] auto-learn N · ?all reveal everything (debug) · ?day=N · ?z=0..1 · ?open=lemma · ?walk · ?probe=auto)
// =====================================================================
if(Q.has("reset"))localStorage.removeItem("atlas-fog");
const had=load();if(Q.has("day"))day=+Q.get("day");
if(Q.has("z"))zoom=+Q.get("z");
if(!had){auto=true;revealCell(HOLA,SEED0.key);revealCell(MUNDO,SEED0.key);auto=false}
if(Q.has("all")){auto=true;for(let i=0;i<N;i++)revealCell(i,"all");auto=false}
for(let i=0;i<N;i++)repaint(i);
if(Q.has("sim"))$("sim").classList.add("on");
reorder();layout();stats();if(narrow())fq.placeholder="find";
if(Q.has("sim")&&+Q.get("sim")>0){auto=true;autoLearn(+Q.get("sim"));auto=false}
if(Q.has("probe")&&Q.get("probe")==="auto"&&!probed){auto=true;startProbe();let g=0;while(step&&step.kind==="probe"&&g++<40){answer(Math.random()<words[step.i].pt?2:1)}auto=false;walk=null;step=null;closePop();stats()}
sel=HOLA;
if(Q.has("open")){const o=Q.get("open");openStep(IDX.has(o)?IDX.get(o):+o,null,false)}
else if(Q.has("walk"))startWalk();
else if(seedDone())openSentence();
else if(!nYours&&!probed)showTip(0);
draw();sc.focus({preventScroll:true});
{const ai=pop.querySelector("[data-ans]");if(ai&&!matchMedia("(hover:none)").matches)ai.focus()}  // a card opened at load (reload mid-ritual, ?open) keeps its input focused
window.__fog={L:()=>L,cellXY,hit,sc,surfaceOf,setZoom,draw,N,words,K,IDX,bank,step:()=>step,walk:()=>walk,startWalk,answer,reveal,toSpell,spelled,commitGuess,toRecall,recalled,continueStep,openStep,autoLearn,advance,select,stats,candidates,order:()=>order,fresh,appear,glide,yours,gapOf,day:()=>day,nRead:()=>nRead,openedS,branch,startProbe,probe:()=>probe};
</script>
