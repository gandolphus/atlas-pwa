<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atlas v1</title>
<style>
:root{
  --crust:#11111b; --mantle:#181825; --base:#1e1e2e;
  --surface0:#313244; --surface1:#45475a; --surface2:#585b70;
  --overlay0:#6c7086; --overlay1:#7f849c; --subtext0:#a6adc8; --subtext1:#bac2de; --text:#cdd6f4;
  --lavender:#b4befe; --red:#f38ba8;
  --ui: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-family: var(--ui);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--crust);color:var(--text);overflow:hidden}
body{display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

/* bar: one row. The Walk button, one sentence of numbers, find, zoom. */
.bar{flex:none;height:44px;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--mantle);border-bottom:1px solid var(--crust);position:relative;z-index:5}
.lang{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--overlay1)}
.cov{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;justify-content:center}
.cov-t{font-size:12px;color:var(--overlay1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cov-t b{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
.cov-t em{font-style:normal;color:var(--lavender);font-variant-numeric:tabular-nums}
.cov-t button{color:var(--overlay1);text-decoration:underline dotted var(--surface2);text-underline-offset:3px}
.cov-t button:hover{color:var(--text)}
.cov-t kbd{font:inherit;color:var(--subtext0)}
.track{height:2px;background:var(--surface0);position:relative}
.track i{position:absolute;left:0;top:0;bottom:0;background:var(--lavender);width:0}
.go{height:26px;padding:0 10px;border-radius:3px;background:var(--surface0);color:var(--lavender);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.go:hover{background:var(--surface1)}
.go.on{background:var(--lavender);color:var(--crust)}
.go.done{color:var(--subtext0)}
#fq{width:140px;height:26px;background:var(--base);border:1px solid var(--surface0);border-radius:3px;color:var(--text);padding:0 8px;font:12px var(--ui)}
#fq::placeholder{color:var(--overlay0)}
#fq:focus{outline:none;border-color:var(--lavender)}
.rd{height:26px;padding:0 9px;border-radius:3px;color:var(--overlay1);font-size:12px;white-space:nowrap}
.rd:hover{background:var(--surface0);color:var(--text)}
.rd.on{color:var(--text);box-shadow:inset 0 -2px 0 var(--text)}
.zoom{display:flex;align-items:center;gap:2px}
.zoom button{width:24px;height:24px;border-radius:3px;color:var(--overlay1);font-size:15px;line-height:1}
.zoom button:hover{background:var(--surface0);color:var(--text)}

/* board: one sticky canvas over a tall spacer, native scroll */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:thin;scrollbar-color:var(--surface0) transparent;outline:none}
#cv{position:sticky;top:0;display:block;touch-action:pan-y;cursor:default}
#sp{width:1px}

/* hover label / touch loupe */
.tip{position:fixed;z-index:30;pointer-events:none;display:none;background:var(--mantle);border:1px solid var(--surface1);border-radius:3px;padding:4px 8px;font-size:13px;white-space:nowrap;max-width:min(360px,90vw);overflow:hidden;text-overflow:ellipsis}
.tip b{font-weight:600}
.tip span{color:var(--subtext0)}
.tip small{color:var(--overlay0);font-variant-numeric:tabular-nums;margin-left:6px}
.tip.loupe{font-size:20px;padding:8px 14px}

/* the card: a popover beside the selected cell's hundred-block */
.pop{position:fixed;z-index:20;width:380px;max-height:calc(100dvh - 60px);overflow:hidden auto;background:var(--mantle);border:1px solid var(--surface1);border-radius:6px;padding:16px 16px 12px;display:none;scrollbar-width:thin}
.pop.on{display:block}
.arr{position:absolute;width:10px;height:10px;background:var(--mantle);border-left:1px solid var(--surface1);border-top:1px solid var(--surface1)}
.x{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:4px;color:var(--overlay1);font-size:18px}
.x:hover{background:var(--surface0);color:var(--text)}
.cl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--overlay0);padding-right:30px;display:flex;gap:10px}
.cl i{font-style:normal;color:var(--lavender)}
.ph{display:flex;align-items:baseline;gap:10px;padding-right:26px;flex-wrap:wrap;margin-top:4px}
.ph h2{font-size:26px;font-weight:600;letter-spacing:-.01em}
.ph h2 i{font-style:normal;font-weight:400;color:var(--subtext0)}
.ph small{font-size:11px;color:var(--overlay0);font-variant-numeric:tabular-nums}
.q{margin-top:12px;font-size:13px;color:var(--overlay1);line-height:1.5}
.cue{font-size:19px;line-height:1.5;margin-top:10px}
.cue.big{font-size:22px;font-weight:500}
.cue b{color:var(--lavender);font-weight:500;letter-spacing:.06em}
.cue .en{display:block;font-size:13px;color:var(--overlay1);font-weight:400;margin-top:4px}
.cue canvas{display:block;width:100%;height:120px;background:var(--base);border-radius:3px}
.tk{cursor:pointer;border-radius:2px;padding:0 1px}
.tk:hover{background:var(--surface0)}
.tk.tg{color:var(--lavender);font-weight:600}
.tk.unk{text-decoration:underline dotted var(--overlay1);text-underline-offset:4px}
.tk.miss{text-decoration:underline wavy var(--text);text-underline-offset:4px}
.tk.off{color:var(--overlay0);font-style:italic;cursor:default}
.ans{width:100%;margin-top:10px;background:var(--base);border:1px solid var(--surface0);border-radius:3px;padding:8px 10px;font-size:15px;color:var(--text)}
.ans:focus{outline:1px solid var(--lavender);border-color:transparent}
.tr{font-size:16px;margin-top:10px}
.en2{font-size:13px;color:var(--overlay1);margin-top:3px;line-height:1.45}
.near{margin-top:10px;font-size:14px;line-height:1.5}
.near i{display:block;font-style:normal;color:var(--overlay1);font-size:12px;margin-top:2px}
.gr{margin-top:10px;font-size:12px;color:var(--overlay1);border-left:2px solid var(--surface0);padding-left:9px;line-height:1.45}
.vd{margin-top:10px;font-size:13px;line-height:1.45}
.vd b{font-weight:500}
.vd.bad{color:var(--red)}
.vd.ok{color:var(--lavender)}
.hooks{margin-top:12px;font-size:13px;line-height:1.5;display:flex;flex-direction:column;gap:3px}
.hooks>div{display:flex;gap:8px;align-items:flex-start}
.hooks em,.rung>em{flex:none;width:70px;font-style:normal;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--overlay0);padding-top:4px}
.hooks .mut{color:var(--overlay1);font-size:12px}
.hooks canvas{width:96px;height:56px;background:var(--base);border-radius:2px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-top:14px}
.rate button{height:42px;background:var(--base);border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;color:var(--subtext1)}
.rate button small{font-size:10px;color:var(--overlay0);font-variant-numeric:tabular-nums}
.rate button:hover{background:var(--surface0)}
.rate button:first-child{color:var(--red)}
.rate button.sug{box-shadow:inset 0 -2px 0 var(--lavender)}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-top:14px}
.yn button{height:40px;background:var(--base);border-radius:2px;font-size:13px;color:var(--subtext1)}
.yn button:hover{background:var(--surface0)}
.yn button small{display:block;font-size:10px;color:var(--overlay0)}
.big{width:100%;height:38px;margin-top:12px;background:var(--base);color:var(--text);border-radius:2px;font-size:13px}
.big:hover{background:var(--surface0)}
.big small{color:var(--overlay0);margin-left:8px;font-size:11px}
.big.cont{position:sticky;bottom:-12px;box-shadow:0 -12px 12px var(--mantle)}
.lnk{font-size:12px;color:var(--overlay1);padding:0;margin-top:10px;margin-right:14px}
.lnk:hover{color:var(--text)}
.lnk.del{color:var(--red)}
.sched{margin-top:10px;font-size:11px;color:var(--overlay0);font-variant-numeric:tabular-nums;line-height:1.5}
.deck{margin-top:12px;border-top:1px solid var(--surface0);padding-top:4px}
.dh{font-size:12px;color:var(--overlay1);padding:8px 0 2px;line-height:1.5}
.dh b{color:var(--text);font-weight:500}
.dh.bad{color:var(--red)}
.rung{display:flex;gap:8px;padding:7px 0 7px 8px;margin-left:-10px;border-left:2px solid transparent}
.rung.sug{border-left-color:var(--lavender)}
.rung .body{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.chip{font-size:12px;padding:3px 8px;background:var(--base);border-radius:2px;color:var(--overlay1);text-align:left;line-height:1.4}
.chip:hover{background:var(--surface0);color:var(--text)}
.chip[aria-pressed=true]{color:var(--lavender);box-shadow:inset 0 0 0 1px var(--lavender)}
.chip.sug{box-shadow:inset 0 0 0 1px var(--red);color:var(--text)}
.chip small{color:var(--overlay0)}
.chip.none{color:var(--overlay0);cursor:default;background:none;padding-left:0}
.rung input{width:100%;background:var(--base);color:var(--text);border:1px solid var(--surface0);border-radius:3px;padding:6px 8px;font-size:13px}
.rung input:focus{outline:1px solid var(--lavender);border-color:transparent}
.rung input::placeholder{color:var(--overlay0)}
canvas.sk{width:100%;height:90px;background:var(--base);border:1px dashed var(--surface0);border-radius:3px;touch-action:none;cursor:crosshair}
.kb{margin-top:10px;font-size:10px;color:var(--overlay0);letter-spacing:.03em;line-height:1.6}
.kb kbd{font:inherit;color:var(--overlay1)}

/* text lens panel */
.lensp{right:12px;top:52px;width:380px}
.lensp h3{font-size:13px;font-weight:600;margin-bottom:8px;padding-right:30px}
.lensp textarea{width:100%;height:140px;resize:vertical;background:var(--base);color:var(--text);border:1px solid var(--surface0);border-radius:3px;padding:8px;font:13px/1.45 var(--ui)}
.lensp textarea:focus{outline:1px solid var(--lavender);border-color:transparent}
.lr{margin-top:10px;font-size:13px;color:var(--overlay1);line-height:1.5}
.lr b{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
.lr em{font-style:normal;color:var(--lavender)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.lnote{margin-top:10px;font-size:11px;color:var(--overlay0);display:flex;justify-content:space-between;gap:8px;align-items:center}
.lnote button{color:var(--overlay1);font-size:11px;padding:3px 8px;background:var(--base);border-radius:2px}

/* simulation strip: prototype only, hidden unless ?sim or ` */
.sim{flex:none;height:28px;display:none;align-items:center;gap:10px;padding:0 14px;background:var(--mantle);border-top:1px solid var(--crust);font-size:11px;color:var(--overlay0);font-variant-numeric:tabular-nums;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.sim.on{display:flex}
.sim b{color:var(--overlay1);font-weight:500}
.sim button{color:var(--overlay1);padding:3px 7px;border-radius:2px;border:1px solid var(--surface0)}
.sim button:hover{background:var(--surface0);color:var(--text)}
.sim .lab{letter-spacing:.1em;text-transform:uppercase;font-size:9px}

@media (max-width:720px){
  .bar{gap:8px;padding:0 10px}
  .lang,#zp,#zm{display:none}
  #fq{width:64px}
  .pop{left:0 !important;right:0;top:auto !important;bottom:0;width:auto;max-height:62dvh;border-radius:10px 10px 0 0;border-width:1px 0 0;padding:18px 18px calc(14px + env(safe-area-inset-bottom))}
  .arr{display:none}
  .x{top:10px;right:10px;width:40px;height:40px;font-size:22px}
  .ph h2{font-size:30px}
  .cue{font-size:21px}.tr{font-size:17px}
  .rate button{height:54px;font-size:14px}
  .yn button{height:50px;font-size:15px}
  .big{height:46px;font-size:15px}
  .ans,.rung input,.lensp textarea{font-size:16px}
  .chip{font-size:14px;padding:6px 10px}
  canvas.sk{height:130px}
  .kb{display:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto !important}}

<style>
/* PWA: safe areas for standalone / notch */
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);min-height:100dvh;height:100dvh}
.bar{height:calc(44px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top)}
.sim{height:calc(28px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
.lang,.cov{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}

<body>
<header class="bar">
  <div class="lang">es</div>
  <div class="cov"><div class="cov-t" id="covt"></div><div class="track"><i id="covb"></i></div></div>
  <button class="go" id="go" title="The Walk (space)"></button>
  <input id="fq" type="search" placeholder="find · :verb · ción" aria-label="Find words" autocomplete="off" spellcheck="false">
  <button class="rd" id="rd" title="Read a text (t)">read</button>
  <div class="zoom"><button id="zm" aria-label="Zoom out">−</button><button id="zp" aria-label="Zoom in">+</button></div>
</header>
<main class="scroll" id="sc" tabindex="0" role="application" aria-label="Spanish lemmas by frequency, in blocks of one hundred. Arrows move, Enter opens, Space walks.">
  <canvas id="cv" aria-hidden="true"></canvas><div id="sp"></div>
</main>
<footer class="sim" id="sim">
  <span class="lab">simulation · not product ui</span><span id="simt"></span>
  <button id="s1">+1 day</button><button id="s7">+7 days studying</button><button id="s21">+21 days away</button><button id="sa">auto-walk today</button><button id="sr">reset</button>
</footer>
<div class="pop" id="pop" role="dialog" aria-label="Word card"></div>
<div class="pop lensp" id="lp" role="dialog" aria-label="Read a text">
  <button class="x" id="lpx" aria-label="Close">×</button>
  <h3>Paste anything you want to read</h3>
  <textarea id="lt" spellcheck="false" placeholder="A message, a song, a paragraph of news…"></textarea>
  <div class="lr" id="lr"></div>
  <div class="lnote"><span>Stays on this device. Nothing is sent anywhere.</span><button id="lclr">clear</button></div>
</div>
<div class="tip" id="tip"></div>
<div class="vh" id="live" aria-live="polite"></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const sc=$("sc"),cv=$("cv"),sp=$("sp"),pop=$("pop"),tip=$("tip"),fq=$("fq"),lp=$("lp"),go=$("go");
const ctx=cv.getContext("2d",{alpha:false});
const Q=new URLSearchParams(location.search);
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const narrow=()=>innerWidth<=720;
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const strip=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"");
const norm=s=>s.trim().toLowerCase().replace(/\s+/g," ");

// ---------- tokens ----------
const css=getComputedStyle(document.documentElement),T=n=>css.getPropertyValue("--"+n).trim();
const C={crust:T("crust"),base:T("base"),s0:T("surface0"),s1:T("surface1"),o0:T("overlay0"),o1:T("overlay1"),sub:T("subtext1"),text:T("text"),lav:T("lavender"),red:T("red")};
const hex=h=>[1,3,5].map(j=>parseInt(h.slice(j,j+2),16));
const mix=(a,b,t)=>{const A=hex(a),B=hex(b);return"rgb("+A.map((v,j)=>Math.round(v*t+B[j]*(1-t))).join(",")+")"};
// colour buckets: 0 unseen · 1..32 tint by k (claimed sits at k=.3, enrolled by stability)
const NB=33,COL=[C.base];for(let b=0;b<32;b++)COL.push(mix(C.lav,C.s0,.15+.85*b/31));

// CONTENT (real lemma list from prototypes/data, top 10,000 embedded, board = top 5,000; hand-written glosses/hooks for ~330 lemmas)

// =====================================================================
// LAYOUT + DRAW: hundred-blocks on one canvas (from atlas-instrument)
// =====================================================================
const PMIN=3,PMAX=180;let L={},dpr=1;
function layout(){
  const W=sc.clientWidth,vh=sc.clientHeight,nb=Math.ceil(N/100);
  const pd=PMIN*Math.pow(PMAX/PMIN,zoom);
  const minB=Math.max(W>=900?2:1,Math.ceil(W/(10*PMAX*1.08))),maxB=Math.max(minB,Math.min(nb,Math.floor(W/(10*PMIN+3))));
  const geo=b=>{const pe=W/(b*10),G=Math.max(3,Math.min(b===1?8:18,Math.round(pe*.42))),p=(W-(b+1)*G)/(b*10);return{G,p,H:G+Math.ceil(nb/b)*(10*p+G)}};
  let fitB=minB;while(fitB<maxB&&geo(fitB).H>vh)fitB++;
  const bpr=Math.max(minB,Math.min(fitB,Math.round(W/(10*pd*1.06))));
  if(bpr===fitB&&W/(10*pd*1.06)>fitB)zoom=Math.max(0,zOfB(fitB,W));
  const{G,p}=geo(bpr),bw=10*p,bh=bw+G,brows=Math.ceil(nb/bpr);
  const stage=p<7?0:p<28?1:p<46?2:3;
  const gap=stage===0?0:p<34?1:2;
  L={W,vh,bpr,fitB,p,G,bw,bh,brows,stage,gap,H:G+brows*bh};
  dpr=Math.min(2,devicePixelRatio||1);
  cv.width=Math.round(W*dpr);cv.height=Math.round(vh*dpr);cv.style.width=W+"px";cv.style.height=vh+"px";
  sp.style.height=Math.max(0,L.H-vh)+"px";
}
const cellXY=i=>{const b=i/100|0,j=i%100,br=b/L.bpr|0,bc=b%L.bpr;return{x:L.G+bc*(L.bw+L.G)+(j%10)*L.p,y:L.G+br*L.bh+(j/10|0)*L.p}};
function hit(x,y){
  const bc=Math.floor((x-L.G)/(L.bw+L.G)),lx=x-L.G-bc*(L.bw+L.G);if(bc<0||bc>=L.bpr||lx<0||lx>=L.bw)return-1;
  const br=Math.floor((y-L.G)/L.bh),ly=y-L.G-br*L.bh;if(br<0||ly<0||ly>=L.bw)return-1;
  const i=(br*L.bpr+bc)*100+Math.floor(ly/L.p)*10+Math.floor(lx/L.p);return i<N?i:-1;
}
function setZoom(z,ai,sy){
  zoom=Math.max(0,Math.min(1,z));
  if(ai==null||ai<0){ai=sel>=0&&isVisible(sel)?sel:hit(L.W/2,sc.scrollTop+L.vh/3);if(ai<0)ai=0}
  if(sy==null)sy=cellXY(ai).y-sc.scrollTop;

}
const zOfB=(b,W=L.W)=>Math.log(W/(10*b*1.06)/PMIN)/Math.log(PMAX/PMIN);
function zoomStep(d){const b=L.bpr,nb=d>0?Math.min(b-1,Math.floor(b*.8)):Math.max(b+1,Math.ceil(b*1.25));setZoom(zOfB(Math.max(1,nb)))}

const B=Array.from({length:NB},()=>[]),vis=[],anims=new Map();
let sel=-1,hov=-1,ra=-1,rb=-1,qm=null,fm=null,lm=null,ul=null,link=new Set(),collide=-1;
function remask(){qm=fm&&lm?fm.map((v,i)=>v&lm[i]):(fm||lm)}
let dirty=false;const req=()=>{if(!dirty){dirty=true;requestAnimationFrame(()=>{dirty=false;draw()})}};
const w100=new Float32Array(N).fill(-1);
function fit(i,fs,av,txt){
  if(w100[i]<0){const f=ctx.font;ctx.font="500 100px "+T("ui");w100[i]=ctx.measureText(words[i].w).width;ctx.font=f}
  const w=w100[i]*fs/100;if(w*.8<=av)return words[i].w;
  const n=Math.max(1,Math.floor(words[i].w.length*av/(w*.8))-1);return words[i].w.slice(0,n)+"…";
}
const inkOf=i=>due[i]?2:bk[i]===0?0:kCell(i)>=.55?3:2;
const INK=[C.o1,C.sub,C.text,C.crust];
function draw(){
  const now=performance.now();
  const{W,vh,bpr,p,G,bw,bh,brows,stage,gap}=L,s=sc.scrollTop;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=C.crust;ctx.fillRect(0,0,W,vh);
  for(const a of B)a.length=0;vis.length=0;
  const r0=Math.max(0,Math.floor((s-G)/bh)),r1=Math.min(brows-1,Math.floor((s+vh)/bh));
  for(let br=r0;br<=r1;br++){const by=G+br*bh-s;
    for(let bc=0;bc<bpr;bc++){const b0=(br*bpr+bc)*100;if(b0>=N)break;const bx=G+bc*(bw+G);
      for(let r=0;r<10;r++){const y=by+r*p;if(y+p<0||y>vh)continue;const i0=b0+r*10;if(i0>=N)break;
        for(let c=0;c<10&&i0+c<N;c++){const i=i0+c;vis.push(i,bx+c*p,y);B[bk[i]].push(bx+c*p,y)}}}}
  const Rc=(x,y)=>{const x0=Math.round(x),y0=Math.round(y);ctx.rect(x0,y0,Math.round(x+p)-gap-x0,Math.round(y+p)-gap-y0)};
  for(let b=0;b<NB;b++){const a=B[b];if(!a.length)continue;ctx.fillStyle=COL[b];ctx.beginPath();for(let j=0;j<a.length;j+=2)Rc(a[j],a[j+1]);ctx.fill()}

  ctx.fillStyle=C.crust;ctx.beginPath();
  for(let j=0;j<vis.length;j+=3){const i=vis[j];let f=due[i]?1:0;const a=anims.get(i);
    if(a!==undefined){const t=(now-a)/240;if(t>=1)anims.delete(i);else f=1-t*(2-t)}
    if(f<=0)continue;const x=Math.round(vis[j+1]),y=Math.round(vis[j+2]),cs=Math.round(vis[j+1]+p)-gap-x,inn=(cs-2*rw)*f;
    if(inn>=1)ctx.rect(x+(cs-inn)/2,y+(cs-inn)/2,inn,inn)}

  // find / text lens: cells outside the set sink into the ground
  if(qm){ctx.fillStyle="rgba(17,17,27,.82)";ctx.beginPath();for(let j=0;j<vis.length;j+=3)if(!qm[vis[j]])Rc(vis[j+1],vis[j+2]);ctx.fill();
    ctx.fillStyle=C.o1;ctx.beginPath();for(let j=0;j<vis.length;j+=3){const i=vis[j];if(qm[i]&&!enrolled(i)&&!due[i])Rc(vis[j+1],vis[j+2])}ctx.fill()}

      for(let j=0;j<vis.length;j+=3){const i=vis[j];if(qm&&!qm[i])continue;if(inkOf(i)!==k)continue;const x=vis[j+1],y=vis[j+2];
        if(stage===2)ctx.fillText(fit(i,fs,cs-2*pad),x+cs/2,y+cs/2+.5,cs-2*pad);
        else ctx.fillText(fit(i,fs,cs-2*pad),x+pad,y+cs*.5,cs-2*pad)}
      if(stage===3){ctx.globalAlpha=.55;ctx.font=Math.max(9,p*.11).toFixed(1)+"px "+T("ui");
        for(let j=0;j<vis.length;j+=3){const i=vis[j];if(qm&&!qm[i])continue;if(inkOf(i)!==k||!words[i].art)continue;ctx.fillText(words[i].art,vis[j+1]+pad,vis[j+2]+cs*.5-fs*.95)}

  // range selection (1-D)

    ctx.fillStyle="rgba(17,17,27,.5)";ctx.beginPath();for(let j=0;j<vis.length;j+=3){const i=vis[j];if(i>=lo&&i<=hi)Rc(vis[j+1],vis[j+2])}ctx.fill();
    if(p>=7){ctx.strokeStyle=C.text;ctx.lineWidth=w;ctx.beginPath();for(let j=0;j<vis.length;j+=3){const i=vis[j];if(i>=lo&&i<=hi){const x=Math.round(vis[j+1]),y=Math.round(vis[j+2]),cs=Math.round(vis[j+1]+p)-gap-x;ctx.rect(x+w/2+1,y+w/2+1,cs-w-2,cs-w-2)}}ctx.stroke()}}
  // frontier: a step line inside its block; at small zoom the whole block is outlined

// =====================================================================
// SELECTION + CARD PLACEMENT
// =====================================================================
const live=$("live");
function isVisible(i){const y=cellXY(i).y-sc.scrollTop;return y>=0&&y+L.p<=L.vh}
function ensureVisible(i,smooth){
  const y=cellXY(i).y,s=sc.scrollTop,top=narrow()&&pop.classList.contains("on")?L.vh*.38:L.vh;
  let t=null;if(y<s+8)t=y-Math.min(L.vh*.3,120);else if(y+L.p>s+top-8)t=y+L.p-top+Math.min(top*.3,120);

}
function select(i,smooth){
  if(i<0||i>=N)return;sel=i;const k=K(i);
  live.textContent=words[i].w+", rank "+(i+1)+", "+(k.S>0?"learning":k.claimed?"claimed":"new")+(due[i]?", due":"");
  req();ensureVisible(i,smooth);if(pop.classList.contains("on"))place();
}
let side=null,sideBlock=-1;
function place(){
  if(narrow()){pop.style.cssText="";return}
  const r=sc.getBoundingClientRect(),{x,y}=cellXY(sel),cx=r.left+x,cy=r.top+y-sc.scrollTop,p=L.p;
  const b=sel/100|0,bx=r.left+x-(sel%10)*p,vw=innerWidth,vh=innerHeight,pw=pop.offsetWidth,ph=pop.offsetHeight,g=10,m=8;
  const C2={R:bx+L.bw+g,L:bx-g-pw,r:cx+p+g,l:cx-g-pw};
  const ok=k=>C2[k]>=m&&C2[k]+pw<=vw-m;
  if(!(side&&ok(side)&&(b===sideBlock||side==="R"||side==="L")))side=["R","L","r","l"].find(ok)||null;
  sideBlock=b;const top=r.top+m;let px,py;
  if(side){px=C2[side];py=Math.max(top,Math.min(vh-ph-m,cy+p/2-ph*.3))}
  else{px=Math.max(m,Math.min(vw-pw-m,cx+p/2-pw/2));py=cy+p+g;if(py+ph>vh-m)py=Math.max(top,cy-ph-g)}
  pop.style.left=px+"px";pop.style.top=py+"px";
  const ar=pop.querySelector("#arr");if(!ar)return;const ay=Math.max(10,Math.min(ph-20,cy+p/2-py-5));
  if(side==="R"||side==="r")ar.style.cssText="left:-6px;top:"+ay+"px;transform:rotate(-45deg)";
  else if(side)ar.style.cssText="right:-6px;top:"+ay+"px;transform:rotate(135deg)";
  else ar.style.cssText="display:none";
}
function closePop(){pop.classList.remove("on");pop.innerHTML="";side=null;step=null;link.clear();collide=-1;req()}
function goTo(i){if(i<0||i>=N)return;if(walk)stopWalk();if(pop.classList.contains("on"))openStep(i,null,false);else select(i,true)}

// =====================================================================
// THE WALK: one action; every step is a retrieval attempt
// =====================================================================
let walk=null,steps=0,relearn=[],auto=false,today=null,step=null,probe=null;
function budget(){const v=Object.keys(log).map(Number).filter(d=>d<day).sort((a,b)=>b-a).slice(0,7).map(d=>log[d].rev+log[d].ver+log[d].new).filter(x=>x>0).sort((a,b)=>a-b);return Math.max(40,v.length?v[v.length>>1]:0)}
function plan(){
  const Lg=log[day]||(log[day]={rev:0,ver:0,new:0,extra:0}),Bg=budget()+Lg.extra;
  const dl=[];let n7=0,claimed=0,tomorrow=0;
  for(let i=0;i<N;i++){const k=K(i);if(k.S>0){if(dueAt(i,day+1))tomorrow++;if(Rof(k,day)<TARGET)dl.push(i);else if(dueAt(i,day+7))n7++}else if(k.claimed)claimed++}
  const dueTotal=Math.min(Bg,dl.length+Lg.rev),verTotal=Math.min(8,claimed+Lg.ver,Bg-dueTotal);
  const behind=dl.length+Lg.rev>Bg;
  const dueQ=Math.max(0,Math.min(dueTotal-Lg.rev,dl.length)),verQ=behind?0:Math.max(0,verTotal-Lg.ver);
  const room=Bg-dueTotal-verTotal-n7/7;
  const newQ=behind?0:Math.max(0,Math.min(20,Math.round(room/2))-Lg.new);
  today={B:Bg,due:dl,backlog:dl.length,tomorrow,claimed,behind,dueQ,verQ,newQ,L:Lg};
}
function pick(){
  const rl=relearn.find(x=>steps-x.at>=8);
  if(rl){relearn.splice(relearn.indexOf(rl),1);return{kind:"again",i:rl.i}}
  plan();
  const w=[["due",today.dueQ],["verify",today.verQ],["new",today.newQ]].filter(x=>x[1]>0);
  if(!w.length){if(relearn.length)return{kind:"again",i:relearn.shift().i};return null}
  let t=w.reduce((a,x)=>a+x[1],0),r=Math.random()*t,kind=w[w.length-1][0];
  for(const x of w){if(r<x[1]){kind=x[0];break}r-=x[1]}
  if(kind==="due"){let best=-1,bs=-1;for(const i of today.due){const s=share(i)*(1-R(i));if(s>bs){bs=s;best=i}}return{kind:"due",i:best}}
  if(kind==="verify"){const c=[];for(let i=F-1;i>=0&&c.length<12;i--)if(K(i).claimed)c.push(i);if(!c.length)for(let i=0;i<N;i++)if(K(i).claimed){c.push(i);break}
    if(!c.length){today.verQ=0;return pick()}return{kind:"verify",i:c[Math.random()*c.length|0]}}

function startWalk(){if(!probed){startProbe();return}steps=0;relearn=[];walk={};next()}
function next(){steps++;const s=pick();if(!s){endWalk();return}openStep(s.i,s.kind,true)}
function endWalk(){walk=null;closePop();stats();msg(narrow()?'✓ done':'✓ done for today · <b>'+(today?today.tomorrow:0)+'</b> due tomorrow')}
function stopWalk(){walk=null;probe=null;closePop();stats()}

// ---------- day 0: find the frontier (adaptive probe, ≤30 taps) ----------
const PG=80,LMIN=Math.log(6),LMAX=Math.log(N),gx=g=>LMIN+(LMAX-LMIN)*g/(PG-1);

function startProbe(){probe={post:new Float64Array(PG).fill(1/PG),asked:new Set(),n:0};walk={};openStep(probeTarget(),"probe",true)}
function probeTarget(){let r=Math.round(Math.exp(pmed(.5)+(Math.random()-.5)*.5));r=Math.max(1,Math.min(N,r));let i=r-1,d=0;while(i<0||i>=N||probe.asked.has(i)){d++;i=r-1+(d%2?d:-d)}return i}
function probeAnswer(i,knows){

  for(let g=0;g<PG;g++)probe.post[g]/=t;

function finishProbe(){

  for(let i=0;i<Fr;i++){const k=K(i);if(k.S===0&&!probe.asked.has(i)){if(i<Fr-300){k.S=120*(1+2*Math.random());k.last=day;k.reps=1;k.seen=1}else k.claimed=1}repaint(i)}
  probed=1;probe=null;walk=null;save();stats();

// ---------- a step: ask → reveal → (hook). Walk steps and direct opens share this. ----------
function openStep(i,kind,inWalk){

function reveal(){

    const surf=step.sent?surfaceOf(step.sent,step.i):step.cue==="chunk"?br(step.frame[0]):step.cue==="mine"?br(K(step.i).hooks.mine):null;step.verdict=check(words[step.i],step.typed,surf)}

  else if(kind==="new"){rate(i,r);Lg.new++;if(r===1&&step.inWalk)relearn.push({i,at:steps})}
  else{rate(i,r,kind==="again");Lg.rev++;if(r===1&&kind!=="again"&&step.inWalk)relearn.push({i,at:steps})}
  if(step.sent){noteCtx(i,step.sent);k.lastCue=step.cue;k.cueN[step.cue]=(k.cueN[step.cue]||0)+1}else if(kind!=="verify"){k.lastCue=step.cue;k.cueN[step.cue]=(k.cueN[step.cue]||0)+1}

  if(!v){fm=null;remask();stats();req();return}
  fm=new Uint8Array(N);let n=0;
  if(v[0]===":"){const p=v.slice(1);for(let i=0;i<N;i++)if(words[i].pos.startsWith(p)){fm[i]=1;n++}}
  else for(let i=0;i<N;i++)if(words[i].norm.includes(v)){fm[i]=1;n++}
  remask();msg('<b>'+n.toLocaleString("en")+'</b> match · <kbd>enter</kbd> next · <kbd>esc</kbd> clear');req();
});
fq.addEventListener("keydown",e=>{
  if(e.key==="Escape"){fq.value="";fq.dispatchEvent(new Event("input"));sc.focus();e.preventDefault()}
  if(e.key==="Enter"&&fm){for(let k=1;k<=N;k++){const i=(Math.max(sel,-1)+k)%N;if(fm[i]){goTo(i);break}}e.preventDefault()}
  e.stopPropagation();
});

// =====================================================================
// POINTER / TOUCH / KEYS
// =====================================================================
const local=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top+sc.scrollTop]};
let tipT=0,tipT2=0,drag=null;
function showTip(i,cx,cy,loupe){
  if(i<0){tip.style.display="none";return}
  tip.className="tip"+(loupe?" loupe":"");
  const k=K(i),st=k.S>0?(due[i]?"due":"stable "+fmtD(k.S)):k.claimed?"claimed":"";
  tip.innerHTML='<b>'+esc((words[i].art?words[i].art+" ":"")+words[i].w)+'</b>'+'<small>#'+(i+1).toLocaleString("en")+(st?' · '+st:'')+'</small>';
  tip.style.display="block";const w=tip.offsetWidth,h=tip.offsetHeight;
  let x=loupe?cx-w/2:cx+14,y=loupe?cy-h-56:cy+16;
  x=Math.max(6,Math.min(innerWidth-w-6,x));if(y+h>innerHeight-6)y=cy-h-10;if(y<50)y=cy+40;
  tip.style.left=x+"px";tip.style.top=y+"px";
}
cv.addEventListener("pointermove",e=>{
  if(e.pointerType==="touch")return;
  const[x,y]=local(e),i=hit(x,y);
  if(drag&&i>=0&&i!==drag.i0){ra=drag.i0;rb=i;drag.moved=true;req()}
  if(i!==hov){hov=i;req();clearTimeout(tipT);clearTimeout(tipT2);tip.style.display="none";
    if(i>=0&&!drag&&!(pop.classList.contains("on")&&i===sel)){ // lemma now; the meaning after a beat — a built-in moment to recall it first
      const cx=e.clientX,cy=e.clientY;
      tipT=setTimeout(()=>showTip(i,cx,cy,false),L.stage<2?0:300)}}
  else if(tip.style.display==="block")showTip(i,e.clientX,e.clientY,false);
});
cv.addEventListener("pointerleave",()=>{hov=-1;clearTimeout(tipT);clearTimeout(tipT2);tip.style.display="none";req()});
cv.addEventListener("pointerdown",e=>{
  if(e.pointerType==="touch"||e.button!==0)return;
  const[x,y]=local(e),i=hit(x,y);if(i<0)return;sc.focus({preventScroll:true});
  if(e.shiftKey&&sel>=0){ra=ra>=0?ra:sel;rb=i;req();return}
  drag={i0:i,moved:false};cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointerup",e=>{
  if(e.pointerType==="touch"||!drag)return;
  const d=drag;drag=null;
  if(step&&step.kind==="probe")return;
  if(!d.moved){ra=rb=-1;if(walk&&d.i0!==sel)stopWalk();if(!walk)openStep(d.i0,null,false)}
  else{msg('<b>'+(Math.abs(rb-ra)+1)+'</b> selected · <kbd>k</kbd> claim · <kbd>esc</kbd>');req()}
});
let tt=null,pinch=null;
cv.addEventListener("touchstart",e=>{
  if(e.touches.length===2){clearTimeout(tt&&tt.timer);tt=null;const[a,b]=e.touches;pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),z:zoom,cy:(a.clientY+b.clientY)/2};return}
  const t=e.touches[0];tt={x:t.clientX,y:t.clientY,t:performance.now(),loupe:false};
  tt.timer=setTimeout(()=>{if(!tt)return;tt.loupe=true;const i=hit(...local(t));tt.i=i;hov=i;showTip(i,t.clientX,t.clientY,true);req()},320);
},{passive:true});
cv.addEventListener("touchmove",e=>{
  if(pinch&&e.touches.length===2){e.preventDefault();const[a,b]=e.touches,d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);const r=cv.getBoundingClientRect(),ai=hit(L.W/2,pinch.cy-r.top+sc.scrollTop);setZoom(pinch.z+Math.log(d/pinch.d)/Math.log(PMAX/PMIN),ai);return}
  if(!tt)return;const t=e.touches[0];
  if(tt.loupe){e.preventDefault();const i=hit(...local(t));if(i!==tt.i){tt.i=i;hov=i;req()}showTip(i,t.clientX,t.clientY,true);return}
  if(Math.hypot(t.clientX-tt.x,t.clientY-tt.y)>8){clearTimeout(tt.timer);tt=null}
},{passive:false});
cv.addEventListener("touchend",e=>{
  if(pinch){if(e.touches.length<2)pinch=null;return}
  if(!tt)return;clearTimeout(tt.timer);const t=e.changedTouches[0];
  if(step&&step.kind==="probe"){tip.style.display="none";hov=-1;tt=null;req();return}
  if(tt.loupe){tip.style.display="none";hov=-1;if(tt.i>=0){if(walk)stopWalk();openStep(tt.i,null,false)}}
  else if(performance.now()-tt.t<400){const i=hit(...local(t));if(i>=0){if(walk&&i!==sel)stopWalk();if(!walk)openStep(i,null,false)}}
  tt=null;
});
let sw=null;
pop.addEventListener("touchstart",e=>{const t=e.touches[0];sw={x:t.clientX,y:t.clientY}},{passive:true});
pop.addEventListener("touchend",e=>{if(!sw||walk)return;const t=e.changedTouches[0],dx=t.clientX-sw.x,dy=t.clientY-sw.y;sw=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>2*Math.abs(dy)&&!/INPUT|TEXTAREA|CANVAS/.test(e.target.tagName))openStep(Math.max(0,Math.min(N-1,sel+(dx<0?1:-1))),null,false)});
sc.addEventListener("wheel",e=>{if(!(e.ctrlKey||e.metaKey))return;e.preventDefault();const[x,y]=local(e);let i=hit(x,y);if(i<0)i=hit(L.W/2,y);setZoom(zoom-e.deltaY*(e.deltaMode?0.05:0.0016),i,i>=0?cellXY(i).y-sc.scrollTop:null)},{passive:false});
sc.addEventListener("scroll",()=>{req();if(pop.classList.contains("on")&&!narrow())place()},{passive:true});
document.addEventListener("pointerdown",e=>{
  if(pop.classList.contains("on")&&!walk&&!pop.contains(e.target)&&e.target!==cv&&!e.target.closest(".bar")&&!lp.contains(e.target))closePop();
  if(lp.classList.contains("on")&&!lp.contains(e.target)&&!e.target.closest("#rd"))closeLens();
});
new ResizeObserver(()=>{if(sc.clientWidth===L.W&&sc.clientHeight===L.vh)return;const a=sel>=0&&isVisible(sel)?sel:null;setZoom(zoom,a);stats()}).observe(sc);
$("zm").onclick=()=>zoomStep(-1);$("zp").onclick=()=>zoomStep(1);
$("covt").addEventListener("click",e=>{if(e.target.id==="fb")goTo(Math.min(F,N-1))});
function moveSel(d,ext){
  if(sel<0){select(0);return}
  let i=sel;const j=i%100,r=j/10|0,c=j%10;
  if(d==="L")i--;else if(d==="R")i++;
  else{const dy=d==="D"?1:-1;if(r+dy>=0&&r+dy<=9)i+=dy*10;else{const b=(i/100|0)+dy*L.bpr;if(b<0)return;i=b*100+(dy>0?0:90)+c}}
  if(i<0||i>=N)return;
  if(ext){if(ra<0)ra=sel;rb=i}else ra=rb=-1;
  if(walk)stopWalk();
  if(pop.classList.contains("on"))openStep(i,null,false);else select(i,false);
}
document.addEventListener("keydown",e=>{
  const t=e.target;if(t.tagName==="TEXTAREA"||t===fq||(t.tagName==="INPUT"&&t.type!=="range"))return;
  if((e.ctrlKey||e.metaKey)&&e.key==="z"){undoLast();e.preventDefault();return}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key,open=pop.classList.contains("on");
  const arrow={ArrowLeft:"L",ArrowRight:"R",ArrowUp:"U",ArrowDown:"D"}[k];
  if(k==="`"){$("sim").classList.toggle("on");setTimeout(()=>setZoom(zoom),0);return}
  if(arrow){e.preventDefault();if(step&&step.kind==="probe")return;moveSel(arrow,e.shiftKey);return}
  if(k==="Escape"){e.preventDefault();if(lp.classList.contains("on"))closeLens();else if(walk)stopWalk();else if(open)closePop();else if(ra>=0){ra=rb=-1;req()}else if(fm){fq.value="";fq.dispatchEvent(new Event("input"))}sc.focus();return}
  if(step&&open){
    const ph=step.phase;
    if(step.kind==="probe"){if(k==="1"||k==="2")answer(+k);return}
    if(k===" "||k==="Enter"){if(t.closest&&t.closest(".pop")&&t.tagName==="BUTTON"&&k==="Enter")return;e.preventDefault();
      if(ph==="ask"||ph==="closed")reveal();else if(ph==="hook")continueStep();else if(ph==="after"&&!K(step.i).S&&!K(step.i).claimed&&k===" ")openStep(step.i,"new",false);return}
    if(/^[1-4]$/.test(k)&&ph==="reveal"){e.preventDefault();answer(+k);return}
    if(k==="h"&&(ph==="reveal"||ph==="after"||ph==="open")){e.preventDefault();step.deck=!step.deck;render();return}
    if(k==="k"&&!walk){e.preventDefault();claim([step.i]);render();return}
    if(walk)return;
  }
  switch(k){
    case"Enter":case" ":e.preventDefault();if(!open){if(k===" ")startWalk();else openStep(sel<0?0:sel,null,false)}break;
    case"+":case"=":zoomStep(1);break;
    case"-":case"_":zoomStep(-1);break;
    case"0":setZoom(0);break;
    case"/":e.preventDefault();fq.focus();fq.select();break;
    case"t":e.preventDefault();lp.classList.contains("on")?closeLens():openLens();break;
    case"k":{if(sel<0)break;if(ra>=0){const lo=Math.min(ra,rb),hi=Math.max(ra,rb),a=[];for(let i=lo;i<=hi;i++)a.push(i);claim(a);ra=rb=-1}else{claim([sel]);select(sel+1,false)}break}
    case"z":undoLast();break;
    case"[":goTo(Math.max(0,sel-100));break;
    case"]":goTo(Math.min(N-1,sel+100));break;
    case"Home":e.preventDefault();goTo(0);break;
    case"End":e.preventDefault();goTo(N-1);break;
    case"PageDown":e.preventDefault();sc.scrollBy(0,L.vh*.9);break;
    case"PageUp":e.preventDefault();sc.scrollBy(0,-L.vh*.9);break;
  }
});

// =====================================================================
// SIMULATION (prototype only): jump time, let a simulated B1 learner answer
// =====================================================================
function simText(){if(!$("sim").classList.contains("on"))return;plan();let s7=0;KM.forEach(k=>{if(k.S>=7)s7++});
  $("simt").innerHTML='day <b>'+day+'</b> · budget <b>'+today.B+'</b> · backlog <b>'+today.backlog+'</b> (shown '+today.dueQ+') · claimed <b>'+today.claimed+'</b> · stable≥7d <b>'+s7+'</b>'}
function autoAnswer(){
  const{kind,i,phase}=step,w=words[i];
  if(kind==="probe"){answer(Math.random()<w.pt?2:1);return}
  if(phase==="hook"){continueStep();return}
  if(phase==="ask")reveal();
  let r;
  if(kind==="verify"||kind==="new"){const ok=Math.random()<w.pt;r=ok?(w.pt>.9&&Math.random()<.5?4:3):(Math.random()<.75?1:2)}
  else{const p=Math.min(.98,R(i)*(.8+.3*w.ease));r=Math.random()<p?(Math.random()<.15?4:3):1}
  answer(r);
}
function autoWalk(){auto=true;closePop();if(!walk)startWalk();let guard=0;while(walk&&step&&guard++<3000)autoAnswer();auto=false;walk=null;step=null;save();for(let i=0;i<N;i++)repaint(i);stats();req()}
function advance(d){day+=d;save();for(let i=0;i<N;i++)repaint(i);stats();req()}
$("s1").onclick=()=>{stopWalk();advance(1)};
$("s7").onclick=()=>{stopWalk();for(let j=0;j<7;j++){advance(1);autoWalk()}};
$("s21").onclick=()=>{stopWalk();advance(21)};
$("sa").onclick=()=>{stopWalk();autoWalk()};
$("sr").onclick=()=>{stopWalk();localStorage.removeItem("atlas-v1");location.search="?sim"};

// =====================================================================
// INIT  (?reset · ?sim · ?day=N · ?z=0..1 · ?open=lemma · ?lens · ?walk · ?probe=auto)
// =====================================================================
if(Q.has("reset"))localStorage.removeItem("atlas-v1");
load();if(Q.has("day"))day=+Q.get("day");
if(Q.has("z"))zoom=+Q.get("z");else if(!localStorage.getItem("atlas-v1"))zoom=Math.log(40/PMIN)/Math.log(PMAX/PMIN);
for(let i=0;i<N;i++)repaint(i);
if(Q.has("sim"))$("sim").classList.add("on");
layout();stats();if(narrow())fq.placeholder="find";
sc.scrollTop=Q.has("scroll")?+Q.get("scroll"):Math.max(0,cellXY(F).y-L.vh*.6);
sel=F;
if(Q.has("q")){fq.value=Q.get("q");fq.dispatchEvent(new Event("input"))}
if(Q.has("lens")){$("lt").value=SAMPLE;analyse(SAMPLE);$("rd").classList.add("on");if(Q.get("lens")==="panel")openLens()}
if(Q.has("probe")&&Q.get("probe")==="auto"&&!probed){auto=true;startProbe();let g=0;while(step&&step.kind==="probe"&&g++<40)autoAnswer();auto=false;walk=null;step=null;closePop();stats()}
if(Q.has("open")){const o=Q.get("open");openStep(IDX.has(o)?IDX.get(o):+o,null,false)}
else if(Q.has("walk"))startWalk();
draw();sc.focus({preventScroll:true});
window.__atlas={L:()=>L,setZoom,draw,zoomStep,N,words,K,step:()=>step,walk:()=>walk,startWalk,answer,reveal,continueStep,openStep,autoWalk,advance,openLens,select,stats,plan:()=>{plan();return today},probe:()=>probe,IDX,bank,day:()=>day,F:()=>F,mask:()=>({f:!!fm,l:!!lm,q:!!qm})};
</script>
