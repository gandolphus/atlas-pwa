<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas · small batch</title>
<style>
:root{--crust:#11111b;--mantle:#181825;--base:#1e1e2e;--s0:#313244;--s1:#45475a;--s2:#585b70;--o0:#6c7086;--o1:#7f849c;--sub0:#a6adc8;--sub1:#bac2de;--text:#cdd6f4;--lav:#b4befe;--green:#a6e3a1;--red:#f38ba8;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--crust);color:var(--text);overflow:hidden}
body{display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
.bar{flex:none;height:44px;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--mantle);border-bottom:1px solid var(--crust);font-size:12px;color:var(--o1)}
.bar .lang{letter-spacing:.14em;text-transform:uppercase}
.bar b{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
.bar em{font-style:normal;color:var(--green)}
.bar .due{color:var(--lav)}
.main{flex:1;display:flex;min-height:0}
.area{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.grid{width:min(100%,max(1000px,42vw));display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.tile{aspect-ratio:1.45;border-radius:4px;background:var(--base);display:flex;align-items:center;justify-content:center;font-size:clamp(11px,1vw,14px);color:var(--o0);font-variant-numeric:tabular-nums;position:relative;border:1px solid transparent;transition:background .15s}
.tile.fog{background:var(--mantle);color:var(--s1);cursor:default}
.tile.open{cursor:pointer}
.tile.open:hover{background:var(--s0)}
.tile.L{background:#2a3a35;color:var(--green);font-weight:500}
.tile.L:hover{background:#31453e}
.tile.L.due::after{content:"";position:absolute;right:5px;top:5px;width:5px;height:5px;border-radius:50%;background:var(--lav)}
.tile:focus-visible{outline:2px solid var(--lav);outline-offset:1px}
.tile.sel{border-color:var(--lav)}
.tile.inb{border-color:var(--lav);background:var(--s0);color:var(--text)}
.tile.inb.cur{background:#3a3d5c}
.tile.pulse{animation:wave 1.1s ease-out both;animation-delay:var(--d)}
@keyframes wave{0%{box-shadow:0 0 0 0 rgba(166,227,161,.0);filter:brightness(1)}30%{box-shadow:0 0 0 3px rgba(166,227,161,.35);filter:brightness(1.5)}100%{box-shadow:0 0 0 6px rgba(166,227,161,0);filter:brightness(1)}}
.tip{position:fixed;z-index:30;pointer-events:none;display:none;background:var(--mantle);border:1px solid var(--s1);border-radius:3px;padding:3px 8px;font-size:13px}
/* docked panel pushes grid */
.panel{flex:none;width:0;overflow:hidden;background:var(--mantle);border-left:1px solid var(--crust);transition:width .18s ease}
.panel.on{width:min(470px,36vw);min-width:420px}
.pin{width:min(470px,36vw);min-width:420px;height:100%;padding:16px 20px;display:flex;flex-direction:column;overflow-y:auto}
.hd{display:flex;align-items:center;gap:10px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--o0);min-height:26px}
.hd i{font-style:normal;color:var(--lav)}
.hd .sp{flex:1}
.hd button{font-size:11px;letter-spacing:.02em;text-transform:none;color:var(--o1);padding:3px 8px;border-radius:3px}
.hd button:hover{background:var(--s0);color:var(--text)}
.hd .x{font-size:18px;padding:0 7px;line-height:1.3}
.strip{display:grid;gap:6px;margin-top:12px}
.mc{background:var(--base);border:1px solid var(--s0);border-radius:4px;padding:8px 10px;min-height:52px;display:flex;flex-direction:column;gap:2px;transition:border-color .15s,background .15s}
.mc .l{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .s{font-size:11px;color:var(--o0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:15px}
.mc.cur{border-color:var(--lav);background:#232338}
.mc.pend .l{color:var(--o1)}
.mc.ok{border-color:#3d5a3f}.mc.ok .l{color:var(--green)}
.mc.rq .s{color:var(--lav)}
.mc.rq{border-style:dashed;border-color:var(--s2)}
.body{flex:1;margin-top:22px}
.big{font-size:30px;font-weight:600;letter-spacing:-.01em}
.big small{font-size:12px;font-weight:400;color:var(--o0);margin-left:8px;letter-spacing:0}
.q{margin-top:6px;font-size:13px;color:var(--o1)}
.sent{margin-top:16px;font-size:20px;line-height:1.5}
.sent .en{display:block;font-size:13px;color:var(--o1);margin-top:3px}
.w{border-radius:2px}
.w.lit{color:var(--lav);font-weight:600}
.w.oth{color:var(--sub0);text-decoration:underline dotted var(--s2);text-underline-offset:4px}
.w.kn{color:var(--green)}
.blank{color:var(--lav);letter-spacing:.1em}
.in{width:100%;margin-top:18px;background:var(--base);border:1px solid var(--s0);border-radius:4px;padding:10px 12px;font-size:16px;color:var(--text)}
.in:focus{outline:none;border-color:var(--lav)}
.fb{margin-top:12px;font-size:14px;line-height:1.5}
.fb.bad b{color:var(--red);font-weight:500}.fb.ok{color:var(--green)}
.fb em{font-style:normal;color:var(--text);font-weight:600}
.row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--s0);align-items:baseline;font-size:14px}
.row:last-of-type{border-bottom:0}
.row .l{font-weight:600;min-width:84px}
.row .g{color:var(--text)}
.row .u{margin-left:auto;font-size:12px;color:var(--o0);text-align:right}
.row .u.y{color:var(--green)}
.lab{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--o0);margin:18px 0 2px}
.go{width:100%;height:40px;margin-top:20px;background:var(--base);border:1px solid var(--s0);border-radius:4px;font-size:13px;color:var(--text)}
.go:hover{background:var(--s0)}
.go.pri{border-color:var(--lav);color:var(--lav)}
.go kbd,.kb kbd{font:inherit;color:var(--o1);margin-left:8px;font-size:11px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:20px}
.rate button{height:46px;background:var(--base);border-radius:4px;border:1px solid var(--s0);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--sub1)}
.rate button small{font-size:10px;color:var(--o0)}
.rate button:hover{background:var(--s0)}
.rate button:first-child{color:var(--red)}
.deep{display:flex;gap:4px;margin-top:22px;padding-top:12px;border-top:1px solid var(--s0);flex-wrap:wrap}
.deep button{font-size:12px;color:var(--o1);padding:5px 9px;border-radius:3px;border:1px solid var(--s0)}
.deep button:hover{background:var(--s0);color:var(--text)}
.deep button u{text-decoration:none;color:var(--lav)}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:12px;padding:3px 8px;border:1px solid var(--s0);border-radius:3px;background:var(--base);color:var(--sub1)}
.chip.L{color:var(--green)}
.chip:hover{background:var(--s0)}
.sched{margin-top:14px;font-size:12px;color:var(--o0)}
.kb{font-size:10px;color:var(--o0);letter-spacing:.03em;padding-top:12px;line-height:1.6}
.tag{display:inline-block;font-size:11px;color:var(--lav);margin-left:8px}
</style>
</head>
<body>
<div class="bar"><span class="lang">Español</span><span><b id="nL">0</b> <em>learned</em></span><span class="due" id="nD"></span></div>
<div class="main">
  <div class="area" id="area"><div class="grid" id="grid"></div></div>
  <aside class="panel" id="panel"><div class="pin" id="pin"></div></aside>
</div>
<div class="tip" id="tip"></div>
<script>
// ---------- data ----------
const W={
ser:["verb","to be (is, are)","f1"],tener:["verb","to have","f2"],ir:["verb","to go","f2"],estar:["verb","to be (place, state)","f1"],querer:["verb","to want","f2"],hoy:["adv","today","f3"],
grande:["adj","big, large","f4"],casa:["noun","house, home","f5"],"día":["noun","day","f3"],bueno:["adj","good","f6"],vida:["noun","life","f7"],agua:["noun","water","f8"],comer:["verb","to eat","f8"],
mundo:["noun","world","f9"],hola:["interj","hello","f9"],gracias:["interj","thanks, thank you","f9"],amigo:["noun","friend","f9"],tiempo:["noun","time; weather","f3"],hombre:["noun","man","f10"],mujer:["noun","woman","f10"],
"niño":["noun","child, boy","f10"],ahora:["adv","now","f3"],siempre:["adv","always","f3"],mucho:["adj","a lot, much","f4"],malo:["adj","bad","f6"],nuevo:["adj","new","f6"],"pequeño":["adj","small","f4"],
hablar:["verb","to speak, to talk","f11"],vivir:["verb","to live","f7"],leer:["verb","to read","f12"],escribir:["verb","to write","f12"],beber:["verb","to drink","f8"],libro:["noun","book","f12"],carta:["noun","letter","f12"],
pan:["noun","bread","f8"],perro:["noun","dog","f13"],gato:["noun","cat","f13"],noche:["noun","night","f3"],"mañana":["noun","morning; tomorrow","f3"],ciudad:["noun","city","f5"],escuela:["noun","school","f5"],"sueño":["noun","sleep; dream","f7"]};
const ORDER=Object.keys(W);
const FOG="de que y a en un por con no su para como pero más este si ya o".split(" ");
// {form|lemma}: every dictionary word is marked
const SENT=[
["{Hola}, {mundo}.","Hello, world."],
["{Gracias}, {amigo}.","Thank you, friend."],
["{Tengo|tener} una {casa} {grande}.","I have a big house."],
["{Quiero|querer} {beber} {agua}.","I want to drink water."],
["El {perro} y el {gato} {están|estar} en la {casa}.","The dog and the cat are in the house."],
["{Hoy} {leo|leer} un {libro} {nuevo}.","Today I read a new book."],
["Por la {noche} {escribo|escribir} una {carta}.","At night I write a letter."],
["Mi {amigo} {vive|vivir} en una {ciudad} {pequeña|pequeño}.","My friend lives in a small city."],
["{Siempre} {como|comer} {pan} por la {mañana}.","I always eat bread in the morning."],
["El {tiempo} {es|ser} {malo} {hoy}.","The weather is bad today."],
["Una {mujer} y un {hombre} {hablan|hablar}.","A woman and a man are talking."],
["El {niño} {tiene|tener} {mucho} {sueño}.","The boy is very sleepy."],
["{Ahora} {voy|ir} a la {escuela}.","Now I am going to school."],
["{Es|ser} un {buen|bueno} {día}.","It is a good day."],
["La {vida} {es|ser} {buena|bueno}.","Life is good."],
["{Comemos|comer} {pan} y {bebemos|beber} {agua}.","We eat bread and drink water."]];
const parse=s=>[...s.matchAll(/\{([^}|]+)(?:\|([^}]+))?\}|([^{]+)/g)].map(m=>m[3]!==undefined?{t:m[3]}:{t:m[1],l:m[2]||m[1].toLowerCase()});
const SP=SENT.map(([es,en])=>({es:parse(es),en}));
const sentsOf=l=>SP.map((s,i)=>s.es.some(p=>p.l===l)?i:-1).filter(i=>i>=0);
// tiles: ~60, some fog
const TILES=[];{let d=0,f=0;for(let i=0;i<60;i++){if((i*7)%10<3&&f<FOG.length)TILES.push({fog:FOG[f++]});else TILES.push({l:ORDER[d++]})}}
const S={};ORDER.forEach(l=>S[l]={L:false,due:false,ivl:"6 days",k:0});
"hola mundo gracias amigo casa grande agua comer ir tener ser bueno día vida".split(" ").forEach((l,i)=>{S[l].L=true;S[l].ivl=["3 days","9 days","5 days","2 days","12 days","6 days","tomorrow"][i%7]});
["agua","comer","amigo","hola"].forEach(l=>S[l].due=true);
let batchN=3,card=null;
const $=id=>document.getElementById(id);
const idx=l=>TILES.findIndex(t=>t.l===l);
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[¿?¡!.,]/g,"").trim();
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
// ---------- atlas ----------
function drawGrid(){
  const g=$("grid");g.innerHTML="";
  TILES.forEach((t,i)=>{const b=document.createElement("button");b.className="tile";b.dataset.i=i;
    if(t.fog){b.classList.add("fog");b.tabIndex=-1;b.textContent=i+1}
    else{const s=S[t.l];b.classList.add("open");if(s.L){b.classList.add("L");b.textContent=t.l;if(s.due)b.classList.add("due")}else b.textContent=i+1;b.tabIndex=0;
      b.onclick=()=>openWord(t.l);
      b.onmouseenter=e=>{const r=b.getBoundingClientRect(),p=$("tip");p.textContent=t.l;p.style.display="block";p.style.left=r.left+"px";p.style.top=(r.top-28)+"px"};
      b.onmouseleave=()=>$("tip").style.display="none"}
    g.appendChild(b)});
  const n=ORDER.filter(l=>S[l].L).length,d=ORDER.filter(l=>S[l].L&&S[l].due).length;
  $("nL").textContent=n;$("nD").textContent=d?d+" due":"";
  markTiles();
}
function markTiles(){
  document.querySelectorAll(".tile").forEach(t=>t.classList.remove("inb","cur","sel"));
  if(!card)return;
  const ls=card.kind==="learn"?card.batch.map(b=>b.l):[card.l];
  ls.forEach(l=>{const t=document.querySelector(`.tile[data-i="${idx(l)}"]`);if(t){t.classList.add(card.kind==="learn"?"inb":"sel");if(card.kind==="learn"&&l===cur().l)t.classList.add("cur")}});
}
document.addEventListener("keydown",e=>{
  const a=document.activeElement;
  if(a&&a.classList.contains("tile")&&e.key.startsWith("Arrow")){
    const i=+a.dataset.i,dl={ArrowLeft:-1,ArrowRight:1,ArrowUp:-10,ArrowDown:10}[e.key];let j=i;
    do{j+=dl}while(j>=0&&j<60&&TILES[j].fog);
    if(j>=0&&j<60){document.querySelector(`.tile[data-i="${j}"]`).focus();e.preventDefault()}return}
  if(e.key==="Escape"&&card){closeCard();return}
  if(!card)return;
  const inp=a&&a.tagName==="INPUT";
  if(e.altKey&&card.kind==="learn"&&card.phase==="guess"&&card.n0===0&&(e.key==="1"||e.key==="3")){e.preventDefault();setN(+e.key);return}
  if(e.key==="Enter"){e.preventDefault();onEnter();return}
  if(!inp&&card.kind!=="learn"&&card.rev){
    if(card.due&&"1234".includes(e.key)&&e.key.length==1)return rate(+e.key);
    if(e.key==="s")deepen("sent");if(e.key==="f")deepen("fam");if(e.key==="t")deepen("type");
  }
  if(!inp&&card.kind==="known"&&!card.due&&!card.ask){if(e.key==="s")deepen("sent");if(e.key==="f")deepen("fam");if(e.key==="t")deepen("type")}
});
// ---------- shared render bits ----------
function sentHTML(si,lit,batchSet,hideOthers){
  return SP[si].es.map(p=>{if(!p.l)return esc(p.t);
    if(p.l===lit)return `<span class="w lit">${esc(p.t)}</span>`;
    if(batchSet&&batchSet.has(p.l))return `<span class="w oth">${esc(p.t)}</span>`;
    return `<span class="w ${S[p.l]&&S[p.l].L?'kn':''}">${esc(p.t)}</span>`}).join("")}
function clozeHTML(si,lit){return SP[si].es.map(p=>p.l===lit?`<span class="blank">_____</span>`:esc(p.t)).join("")}
function formIn(si,l){return SP[si].es.find(p=>p.l===l).t}
const panel=()=>$("panel"),pin=()=>$("pin");
function openPanel(){$("tip").style.display="none";panel().classList.add("on")}
function closeCard(){const l=card&&(card.kind==="learn"?card.batch[0].l:card.l);card=null;panel().classList.remove("on");pin().innerHTML="";markTiles();const t=document.querySelector(`.tile[data-i="${idx(l)}"]`);if(t)t.focus()}
function focusIn(){const i=pin().querySelector("input");if(i)i.focus()}
// ---------- LEARN ----------
function makeBatch(l,n){
  let si=sentsOf(l)[0],pick=[l];
  const free=x=>!S[x].L&&!pick.includes(x);
  // clicked + mates from the same sentence (nearest in rank first)
  const sm=SP[si].es.map(p=>p.l).filter(x=>x&&W[x]&&free(x)).sort((a,b)=>Math.abs(idx(a)-idx(l))-Math.abs(idx(b)-idx(l)));
  while(pick.length<n&&sm.length)pick.push(sm.shift());
  // pad from nearest unlearned words (same family first)
  const rest=ORDER.filter(free).sort((a,b)=>(W[a][2]===W[l][2]?0:1000)+Math.abs(idx(a)-idx(l))-((W[b][2]===W[l][2]?0:1000)+Math.abs(idx(b)-idx(l))));
  while(pick.length<n&&rest.length)pick.push(rest.shift());
  return pick.map(x=>({l:x,si:SP[si].es.some(p=>p.l===x)?si:sentsOf(x)[0],guess:null,st:"pend",miss:0}));
}
const cur=()=>card.phase==="recall"?card.batch.find(b=>b.l===card.q[0]):card.batch[card.gi];
function startLearn(l){
  card={kind:"learn",phase:"guess",batch:makeBatch(l,batchN),gi:0,n0:0,fb:null};
  render();
}
function setN(n){if(batchN===n)return;batchN=n;const l=card.batch[0].l;startLearn(l)}
function openWord(l){
  if(S[l].L){card={kind:"known",l,due:S[l].due,rev:!S[l].due,ask:S[l].due,si:sentsOf(l)[0],deep:null,fb:null};render()}
  else startLearn(l);
}
function stripHTML(){
  const ph=card.phase;
  return `<div class="strip" style="grid-template-columns:repeat(${card.batch.length},1fr)">`+card.batch.map((b,i)=>{
    let c="mc",lab="",sub="";
    if(ph==="guess"){c+=i===card.gi?" cur":(b.guess!==null?"":" pend");lab=b.l;sub=b.guess!==null?(b.guess===""?"no idea":b.guess):(i===card.gi?"guessing":"")}
    else if(ph==="meet"){lab=b.l}
    else if(ph==="recall"){const isC=b.l===card.q[0];c+=isC?" cur":"";if(b.st==="ok"){c+=" ok";lab=b.l;sub="✓"}else{lab="· · · ·";c+=" pend";if(b.miss&&!isC){c+=" rq";sub="↻ again later"}else if(b.miss)sub="↻"}}
    else {c+=" ok";lab=b.l}
    return `<div class="${c}"><span class="l">${esc(lab)}</span><span class="s">${esc(sub)}</span></div>`}).join("")+`</div>`}
function render(){
  openPanel();markTiles();
  if(card.kind==="learn")renderLearn();else renderKnown();
}
function hdLearn(){
  const one=card.batch.length===1;
  const sw=(card.phase==="guess"&&card.n0===0)?`<button id="sw" title="Alt+${one?3:1}">${one?"learn 3 together":"just this word"}</button>`:"";
  const lab={guess:"guess",meet:"meet",recall:"recall",done:"done"}[card.phase];
  return `<div class="hd"><span>New · <i>${one?"one word":"batch of "+card.batch.length}</i> · ${lab}</span><span class="sp"></span>${sw}<button class="x" id="cl">×</button></div>`}
function renderLearn(){
  const ph=card.phase;let h=hdLearn()+stripHTML()+`<div class="body">`;let foot="";
  const bs=new Set(card.batch.map(b=>b.l));
  if(ph==="guess"){
    const b=cur();
    h+=`<div class="big">${esc(b.l)}<small>${W[b.l][0]}</small></div><div class="q">What might it mean? Commit a guess, then the next word.</div>
    <div class="sent">${sentHTML(b.si,b.l,bs)}</div>
    <input class="in" id="in" autocomplete="off" spellcheck="false" placeholder="your guess, in English">`;
    foot=`<kbd>↵</kbd> commit${card.batch.length>1?" · next word":""} · empty <kbd>↵</kbd> = no idea · <kbd>Esc</kbd> close`;
  }else if(ph==="meet"){
    h+=`<div class="lab">Meanings</div>`;
    card.batch.forEach(b=>{const g=guessHit(b);h+=`<div class="row"><span class="l">${esc(b.l)}</span><span class="g">${esc(W[b.l][1])}</span><span class="u ${g?'y':''}">${b.guess===""?"no idea":"you: "+esc(b.guess)+(g?" ✓":"")}</span></div>`});
    const seen=[...new Set(card.batch.map(b=>b.si))];
    h+=`<div class="lab">In use</div>`;
    seen.forEach(si=>{h+=`<div class="sent" style="font-size:17px;margin-top:8px">${SP[si].es.map(p=>p.l&&bs.has(p.l)?`<span class="w lit">${esc(p.t)}</span>`:esc(p.t)).join("")}<span class="en">${esc(SP[si].en)}</span></div>`});
    h+=`<button class="go pri" id="go">Recall them<kbd>↵</kbd></button>`;
    foot=`<kbd>↵</kbd> start recall`;
  }else if(ph==="recall"){
    const b=cur(),fb=card.fb;
    h+=`<div class="big">${esc(W[b.l][1])}<small>${W[b.l][0]}</small></div><div class="q">Type the Spanish word.</div>
    <div class="sent">${clozeHTML(b.si,b.l)}</div>`;
    if(fb){h+=fb.ok?`<div class="fb ok">✓ <em>${esc(fb.ans)}</em>${fb.slip?` &nbsp;<span style="color:var(--sub0)">mind the accent: ${esc(fb.ans)}</span>`:""}</div>`:`<div class="fb bad"><b>✗</b> you wrote ${esc(fb.said||"nothing")} — it is <em>${esc(fb.ans)}</em></div>`;
      h+=`<div class="fb" style="color:var(--o1)">${fb.ok?"":"It comes back at the end of this round."}</div>`;
      foot=`<kbd>↵</kbd> continue`}
    else{h+=`<input class="in" id="in" autocomplete="off" spellcheck="false" placeholder="en español">`;foot=`<kbd>↵</kbd> check · order is shuffled · misses come back last`}
  }else{
    h+=`<div class="lab">Yours now</div>`;
    card.batch.forEach(b=>{h+=`<div class="row"><span class="l" style="color:var(--green)">${esc(b.l)}</span><span class="g">${esc(W[b.l][1])}</span><span class="u">${b.miss?"↻ once more":""}</span></div>`});
    h+=`<div class="sched">Back in 10 minutes, then tomorrow.</div>
    <button class="go pri" id="nx">Next ${card.nxt?"batch: "+card.nxt:""}<kbd>↵</kbd></button>`;
    foot=`<kbd>↵</kbd> next batch · <kbd>Esc</kbd> close`;
  }
  h+=`</div><div class="kb">${foot}</div>`;
  pin().innerHTML=h;wire();focusIn();
}
function guessHit(b){if(!b.guess)return false;const g=norm(b.guess).split(/\s+/).filter(x=>x.length>2&&x!=="the"&&x!=="to"),a=norm(W[b.l][1]).split(/[^a-z]+/);return g.some(x=>a.includes(x))}
function wire(){const c=$("cl");if(c)c.onclick=closeCard;const s=$("sw");if(s)s.onclick=()=>setN(card.batch.length===1?3:1);
  const g=$("go");if(g)g.onclick=onEnter;const n=$("nx");if(n)n.onclick=onEnter;
  pin().querySelectorAll("[data-a]").forEach(el=>el.onclick=()=>actions[el.dataset.a](el.dataset.v))}
function onEnter(){
  if(card.kind==="known")return knownEnter();
  const ph=card.phase;
  if(ph==="guess"){
    const v=($("in").value||"").trim();cur().guess=v;card.n0++;
    if(card.gi<card.batch.length-1){card.gi++;render()}
    else{card.phase="meet";render()}
  }else if(ph==="meet"){card.phase="recall";card.q=shuffle(card.batch.map(b=>b.l));card.fb=null;render()}
  else if(ph==="recall"){
    if(card.fb){ // continue after feedback
      const f=card.fb;card.fb=null;
      if(f.ok){card.q.shift();cur2(f.l).st="ok"}else{card.q.push(card.q.shift())}
      if(!card.q.length)return finishBatch();
      render();return}
    const b=cur(),said=($("in").value||"").trim(),ans=b.l;
    if(!said&&0)return;
    const exact=said.toLowerCase().replace(/[¿?¡!.,]/g,"")===ans,loose=norm(said)===norm(ans);
    if(exact||loose){
      if(exact){card.q.shift();b.st="ok";if(!card.q.length)return finishBatch();render()}
      else{card.fb={ok:true,ans,slip:true,l:b.l};render()}
    }else{b.miss++;card.fb={ok:false,ans,said,l:b.l};render()}
  }else if(ph==="done"){const l=card.nxt;if(l)startLearn(l);else closeCard()}
}
const cur2=l=>card.batch.find(b=>b.l===l);
function finishBatch(){
  card.batch.forEach(b=>{S[b.l].L=true;S[b.l].due=false;S[b.l].ivl="10 min"});
  const ids=card.batch.map(b=>idx(b.l));
  card.phase="done";
  const next=ORDER.find(l=>!S[l].L&&Math.abs(idx(l)-ids[0])<8)||ORDER.find(l=>!S[l].L);
  card.nxt=next||null;
  drawGrid();
  // quiet celebration: a wave from the batch tiles outward
  document.querySelectorAll(".tile").forEach(t=>{const i=+t.dataset.i;if(TILES[i].fog)return;
    const d=Math.min(...ids.map(j=>Math.max(Math.abs((j%10)-(i%10)),Math.abs((j/10|0)-(i/10|0)))));
    if(d<=4){t.style.setProperty("--d",d*90+"ms");t.classList.add("pulse")}});
  renderLearn();
}
// ---------- KNOWN ----------
const RATES=[["Again","1 min"],["Hard","2 days"],["Good","6 days"],["Easy","14 days"]];
function renderKnown(){
  const c=card,l=c.l,s=S[l];
  let h=`<div class="hd"><span>${c.due?"Review · <i>due</i>":"Learned"}</span><span class="sp"></span><button class="x" id="cl">×</button></div><div class="body">`;
  const si=c.si,fam=ORDER.filter(x=>W[x][2]===W[l][2]&&x!==l);
  let foot="";
  const bigH=`<div class="big">${esc(l)}<small>${W[l][0]}</small></div>`;
  if(c.deep==="type"){
    h+=bigH+`<div class="q">${esc(W[l][1])} — type it into the sentence.</div><div class="sent">${clozeHTML(si,l)}</div>`;
    h+=c.fb?`<div class="fb ${c.fb.ok?'ok':'bad'}">${c.fb.ok?'✓ <em>'+esc(l)+'</em>':'<b>✗</b> you wrote '+esc(c.fb.said||"nothing")+' — it is <em>'+esc(l)+'</em>'}</div>`:`<input class="in" id="in" autocomplete="off" spellcheck="false" placeholder="en español">`;
    foot=`<kbd>↵</kbd> ${c.fb?"back":"check"}`;
  }else if(c.ask&&!c.rev){
    h+=bigH+`<div class="q">${c.due?"Due. Recall the meaning, then reveal.":"Practice only: this does not change the schedule."}</div><div class="sent">${sentHTML(si,l,null)}</div>`;
    h+=`<button class="go pri" id="go">Reveal<kbd>↵</kbd></button>`;foot=`<kbd>↵</kbd> reveal · <kbd>Esc</kbd> close`;
  }else{
    h+=`<div class="big">${esc(l)}<small>${W[l][0]}</small></div><div class="q" style="font-size:16px;color:var(--text)">${esc(W[l][1])}</div>
    <div class="sent">${sentHTML(si,l,null)}<span class="en">${esc(SP[si].en)}</span></div>`;
    if(c.deep==="fam")h+=`<div class="lab">Family</div><div class="chips">${fam.map(x=>`<button class="chip ${S[x].L?'L':''}" data-a="open" data-v="${x}">${esc(x)}</button>`).join("")||"none yet"}</div>`;
    if(c.due){h+=`<div class="rate">${RATES.map((r,i)=>`<button data-a="rate" data-v="${i+1}">${r[0]}<small>${i+1} · ${r[1]}</small></button>`).join("")}</div>`;foot=`<kbd>1–4</kbd> how it went`}
    else{h+=`<div class="sched">Next review in ${esc(s.ivl)}.</div>`;
      h+=`<button class="go" id="go">Test me anyway<kbd>↵</kbd></button>`;foot=`<kbd>↵</kbd> test me · <kbd>Esc</kbd> close`}
    h+=`<div class="deep"><button data-a="deep" data-v="sent"><u>S</u> another sentence</button><button data-a="deep" data-v="fam"><u>F</u> family</button><button data-a="deep" data-v="type"><u>T</u> type it</button></div>`;
  }
  h+=`</div><div class="kb">${foot}</div>`;
  pin().innerHTML=h;wire();focusIn();
}
function knownEnter(){
  const c=card;
  if(c.deep==="type"){if(c.fb){c.deep=null;c.fb=null;render();return}
    const said=($("in").value||"").trim();c.fb={ok:norm(said)===norm(c.l),said};render();return}
  if(c.ask&&!c.rev){c.rev=true;render();return}
  if(!c.due&&c.rev){c.ask=true;c.rev=false;render();return}
  if(!c.due&&!c.ask){c.ask=true;c.rev=false;render();return}
}
function deepen(w){
  const c=card;
  if(w==="sent"){const all=sentsOf(c.l);c.si=all[(all.indexOf(c.si)+1)%all.length]}
  c.deep=c.deep===w&&w!=="sent"?null:(w==="sent"?c.deep:w);c.fb=null;render()}
function rate(n){
  const l=card.l;S[l].due=false;S[l].ivl=RATES[n-1][1];
  drawGrid();
  const nx=ORDER.find(x=>S[x].L&&S[x].due);
  if(nx){openWord(nx)}else closeCard();
}
const actions={rate:v=>rate(+v),deep:v=>deepen(v),open:v=>openWord(v)};
drawGrid();
document.querySelector(".tile.open").focus();
</script>
